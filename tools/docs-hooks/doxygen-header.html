<!--
  Doxygen HTML header for the SynQt C++ runtime reference.

  It replaces Doxygen's stock header to do three things the stock one cannot: load
  the doxygen-awesome extensions (copy button, paragraph links, interactive table of
  contents, tabs), pin the page to dark mode with `class="dark-mode"` so the reference
  matches the dark-only documentation site, and join the reference to that site's shell.

  The shell is the point. These pages are published under /api/ref/ and shown inside
  the frame on /api/ (docs/api.md, overrides/api.html), which is an ordinary page of
  the documentation site: its header, tabs, search, repository widget and Download
  modal are the site's own, so there is no copy of them here to drift out of place,
  and they are rendered once for a whole visit through the reference rather than on
  every page. The script below is the whole of the join: a page opened on its own
  redirects into the shell, and a page inside the shell tells it which page it is, so
  the address bar and the browser tab follow the reader. Nothing else on this page
  knows the shell exists.

  A standalone `doxygen Doxyfile` build (output in build/apidocs/html, not under
  /api/ref/) is deliberately left alone by that script and stays self contained.

  The `$name` tokens are Doxygen substitutions; do not rename them. Regenerate the
  stock header to compare against a new Doxygen release with:
      doxygen -w html header.html footer.html stylesheet.css Doxyfile
-->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" class="dark-mode">
<head>
<meta http-equiv="Content-Type" content="text/xhtml;charset=UTF-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=11"/>
<meta name="generator" content="Doxygen $doxygenversion"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- Brand first, then the section, then the page, matching the rest of the site's
     "SynQt - <page>" (overrides/main.html). The landing page's $title is the section
     name itself, so this doubles there ("... - The C++ runtime reference - The C++
     runtime reference"); the doxygen.py hook collapses that one page back to a single
     "SynQt - The C++ runtime reference". Doxygen would otherwise emit "$projectname:
     $title". The shell adopts this title for the browser tab. -->
<title>SynQt - The C++ runtime reference - $title</title>
<script type="text/javascript">
// Join to the documentation site's shell page; see the note at the top of this file.
(function () {
    "use strict";
    var here = window.location;
    var match = /^(.*\/api\/)ref\/(.*)$/.exec(here.pathname);
    if (!match) {
        return; // A standalone build, served from somewhere other than /api/ref/.
    }
    var shell = match[1];
    var page = match[2] || "index.html";
    if (window.top === window) {
        // Opened on its own: hand the reader to the shell, showing this page. `replace`
        // rather than an assignment, so Back leaves the reference instead of bouncing
        // through the page that redirected.
        here.replace(shell
            + (page === "index.html" ? "" : "?p=" + encodeURIComponent(page))
            + here.hash);
        return;
    }
    if (window.parent !== window.top) {
        return; // A frame inside this page (the search results), not the reference.
    }
    function announce() {
        window.top.postMessage({
            type: "synqt-api-nav",
            page: page,
            hash: here.hash,
            title: document.title
        }, here.origin);
    }
    announce();
    window.addEventListener("hashchange", announce);

    // A link that leaves the reference (the license note in the footer, the runtime API
    // page, anything off site) has to replace the whole window rather than load a second
    // copy of the site inside this frame. Links within the reference are left alone, so
    // moving through it keeps the shell, and its header, exactly where they are.
    document.addEventListener("DOMContentLoaded", function () {
        var inside = here.origin + shell + "ref/";
        var links = document.getElementsByTagName("a");
        for (var index = 0; index < links.length; index++) {
            var link = links[index];
            var href = link.getAttribute("href");
            if (!href || link.target || href.charAt(0) === "#") {
                continue;
            }
            if (/^(?:javascript|mailto):/i.test(href)) {
                continue;
            }
            var resolved;
            try {
                resolved = new URL(href, here.href).href;
            } catch (error) {
                continue;
            }
            if (resolved.lastIndexOf(inside, 0) !== 0) {
                link.target = "_top";
            }
        }
    });
})();
</script>
<!-- The same favicon the rest of the site carries (mkdocs.yml theme.favicon), by its
     site-absolute path so the reference and the site share one icon and one cache entry. -->
<link rel="icon" href="/assets/synqt.ico"/>
<!-- The same Roboto the documentation site loads, so this reference is set in the same
     face rather than in a system font that happens to sit next to it. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,300i,400,400i,700,700i%7CRoboto+Mono:400,400i,700,700i&amp;display=fallback"/>
<link href="$relpath^tabs.css" rel="stylesheet" type="text/css"/>
<script type="text/javascript" src="$relpath^jquery.js"></script>
<script type="text/javascript" src="$relpath^dynsections.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-fragment-copy-button.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-paragraph-link.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-interactive-toc.js"></script>
<script type="text/javascript" src="$relpath^doxygen-awesome-tabs.js"></script>
<script type="text/javascript">
    DoxygenAwesomeFragmentCopyButton.init()
    DoxygenAwesomeParagraphLink.init()
    DoxygenAwesomeInteractiveToc.init()
    DoxygenAwesomeTabs.init()
</script>
$treeview
$search
$mathjax
<link href="$relpath^$stylesheet" rel="stylesheet" type="text/css" />
$extrastylesheet
</head>
<body>

<!--BEGIN FULL_SIDEBAR-->
<div id="side-nav" class="ui-resizable side-nav-resizable"><!-- do not remove this div, it is closed by doxygen! -->
<!--END FULL_SIDEBAR-->

<div id="top"><!-- do not remove this div, it is closed by doxygen! -->

<!--BEGIN TITLEAREA-->
<div id="titlearea">
<!-- The head of the sidebar. The way back out of the reference is in the site header
     the shell draws above this frame, so what belongs here is what the sidebar owns:
     the name of the reference, and the search box, which Doxygen emits here in this
     layout (DISABLE_INDEX = YES with FULL_SIDEBAR = YES) rather than into a tab bar. -->
<div id="synqt-sidebar-head">
 <div id="synqt-sidebar-title">C++ runtime reference</div>
 $searchbox
</div>
</div>
<!--END TITLEAREA-->
<!-- end header part -->
