<!doctype html>
<!-- SPDX-FileCopyrightText: 2026 Alexandre 'kidev' Poumaroux
     SPDX-License-Identifier: Apache-2.0

     The editor's one page. Nothing is inline: no script body, no style block, no handler
     attribute, and nothing loaded from anywhere but here, so the page runs under the policy
     the server sends it with (default-src 'none' and 'self' for the rest, no unsafe-inline).
     design.js finds every element below by id and attaches every listener. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Brand first, as every page of the site titles itself (overrides/main.html). -->
    <title>SynQt - Design editor</title>
    <!-- The site's icon. Named, because a browser that is not told asks for /favicon.ico,
         which the server does not have. -->
    <link rel="icon" href="synqt.ico" sizes="any">
    <link rel="stylesheet" href="design.css">
    <!-- The file pane's editor adopts this in its shadow root. Preloaded so the browser has
         it before the pane is built. -->
    <link rel="preload" as="style" href="editor.css">
    <script type="module" src="design.js"></script>
  </head>
  <body>
    <header class="bar">
      <!-- The way out. A design lives in this tab, so the browser asks before leaving, once,
           from the beforeunload listener design.js puts on the window. A dialog of the
           page's own here would make it ask twice. -->
      <a class="bar__home" id="home" href="/" title="Back to synqt.org">
        <img class="bar__mark" src="synqt.svg" alt="SynQt" width="284" height="150">
        <span class="bar__wordmark">Designer</span>
      </a>
      <!-- The project's name. A double click edits it in place, as an entity's name on the
           canvas does. The findings are in the rail under Review, where each one links to
           what it is about. -->
      <span class="bar__project" id="project" hidden
            title="Double click to rename the project"></span>
      <span class="bar__gap"></span>
      <!-- Undo and redo, first among the controls. design.js draws the arrows and enables
           each one only while there is a step that way. -->
      <span class="bar__history">
        <button type="button" class="button button--step" id="undo" disabled
                aria-label="Undo" title="Undo the last change (Ctrl-Z)"></button>
        <button type="button" class="button button--step" id="redo" disabled
                aria-label="Redo" title="Redo the change undone (Ctrl-Shift-Z)"></button>
      </span>
      <!-- A system to start from instead of an empty canvas: the projects the guide is
           written about, each an ordinary design once open. Beside Export, since neither
           touches the project on disk. -->
      <button type="button" class="button button--icon" id="examples" aria-haspopup="menu">
        <span class="button__word">Examples</span>
      </button>
      <!-- The design as a picture, or the project as a zip of the files it would be written
           as. -->
      <button type="button" class="button button--icon" id="export" aria-haspopup="menu">
        <span class="button__word">Export</span>
      </button>
      <button type="button" class="button button--danger button--icon" id="restart" hidden>
        <span class="button__word">Clear</span>
      </button>
      <!-- Offered while synqt.yaml is unlocked: every version of it that read cleanly is
           remembered, and this returns to the last one. -->
      <button type="button" class="button" id="revert" hidden>Back to the last good version</button>
      <button type="button" class="button" id="infer">Infer from the sources</button>
      <button type="button" class="button" id="review">Review changes</button>
      <button type="button" class="button button--go button--icon" id="apply" disabled>
        <span class="button__word">Apply</span>
      </button>
    </header>

    <main class="work">
      <!-- The rail folds as the panel does, so a narrow window keeps room for the drawing.
           Its handle is a button in its top corner while open and the tab left behind once
           folded: one element in two shapes. -->
      <aside class="rail" id="rail">
        <button type="button" class="panel__handle" id="rail-handle"
                aria-expanded="true" aria-controls="rail-body"
                aria-label="Hide the entities"></button>
        <div class="rail__body" id="rail-body">
          <h2 class="rail__title">Add an entity</h2>
          <p class="rail__hint">Drag one onto the canvas, where you want it.</p>
          <div class="palette" id="palette"></div>
          <h2 class="rail__title">Review</h2>
          <ul class="findings findings--verdict" id="findings"></ul>
        </div>
      </aside>

      <section class="stage">
        <div class="stage__canvas">
          <svg class="canvas" id="canvas" xmlns="http://www.w3.org/2000/svg">
            <!-- Zones at the back, then the links and the half-drawn one, so a line passes
                 under a node instead of across it. -->
            <g id="viewport">
              <g id="zones"></g>
              <g id="links"></g>
              <g id="ghost"></g>
              <g id="nodes"></g>
            </g>
          </svg>
          <!-- What just happened, shown once. A situation worth acting on is marked on the
               entity or connect point it is about, and hovering the mark explains it. -->
          <p class="stage__hint" id="hint" role="status" aria-live="polite"></p>
        </div>

        <!-- The same project as text, open from the start. Redrawn from the document on every
             change, and its QML can be edited. Hiding it leaves the bar, which opens it
             again. -->
        <section class="dock" id="dock">
          <!-- Split where the pane below it is split: "Files" and the lock over the tree, the
               open file's name and the chevron that hides the pane over the file. The lock
               is on the Files half because it unlocks every file. -->
          <header class="dock__bar" id="dock-bar">
            <span class="dock__files">
              <span class="dock__title">Files</span>
              <span class="bar__gap"></span>
              <!-- Read-only until unlocked, and then the whole project at once, so a stray
                   keystroke in a file being read edits nothing. -->
              <button type="button" class="button button--lock" id="source-lock"
                      aria-pressed="false"></button>
            </span>
            <span class="dock__file">
              <span class="dock__name" id="source-name"></span>
              <span class="bar__gap"></span>
              <button type="button" class="button button--chevron" id="dock-toggle"
                      aria-expanded="true" aria-controls="dock-pane"
                      aria-label="Collapse the files"></button>
            </span>
          </header>
          <div class="dock__pane" id="dock-pane">
            <ul class="tree" id="tree"></ul>
            <div class="source">
              <!-- The editor: CodeMirror (vendor/README.md), wired up by editor.js and coloured
                   by source.js, which also colours the members along a link on the canvas. -->
              <div class="source__view" id="source-view"></div>
            </div>
          </div>
        </section>
      </section>

      <!-- The panel for whatever is selected. On a narrow window it folds to its tab and
           opens over the canvas instead of leaving the layout, since everything that edits a
           selection is in here. -->
      <aside class="inspector" id="inspector">
        <button type="button" class="panel__handle" id="inspector-handle"
                aria-expanded="true" aria-controls="inspector-body"
                aria-label="Hide the panel"></button>
        <div class="inspector__body" id="inspector-body"></div>
      </aside>

      <!-- Where two panes meet: invisible, and wider than it looks so the edge need not be hit
           exactly. Each one drags the width or height of its pane. -->
      <div class="grip grip--rail" id="grip-rail" role="separator"
           aria-orientation="vertical" aria-label="Resize the rail"></div>
      <div class="grip grip--inspector" id="grip-inspector" role="separator"
           aria-orientation="vertical" aria-label="Resize the panel"></div>
      <div class="grip grip--dock" id="grip-dock" role="separator"
           aria-orientation="horizontal" aria-label="Resize the files"></div>
    </main>

    <!-- What hovering something on the canvas opens, filled by design.js and positioned at
         the pointer. -->
    <div class="tip" id="tip" hidden></div>

    <!-- Every question the page asks, except leaving the site, which the browser asks. A
         real `dialog`, so Escape closes it, focus stays inside it and the page behind it is
         inert. -->
    <dialog class="modal" id="modal" aria-labelledby="modal-title">
      <h2 class="modal__title" id="modal-title"></h2>
      <p class="modal__text" id="modal-text"></p>
      <div class="modal__extra" id="modal-extra"></div>
      <div class="modal__row">
        <button type="button" class="button" id="modal-no">Cancel</button>
        <button type="button" class="button" id="modal-yes">Yes</button>
      </div>
    </dialog>

    <!-- What a right click opens. -->
    <ul class="menu" id="menu" hidden></ul>

    <!-- What crosses a link, chosen from what its owner declares. It opens when a link is
         drawn, with nothing ticked: a member reaches a consumer only when someone picks
         it. -->
    <section class="picker" id="picker" hidden aria-label="What crosses this link"></section>

    <section class="sheet" id="sheet" hidden>
      <header class="sheet__bar">
        <h2 class="sheet__title" id="sheet-title">Changes</h2>
        <button type="button" class="button" id="sheet-close">Close</button>
      </header>
      <p class="sheet__git" id="sheet-git"></p>
      <ul class="findings" id="sheet-findings"></ul>
      <pre class="sheet__diff" id="sheet-diff"></pre>
    </section>
  </body>
</html>
