<!doctype html>
<!-- SPDX-FileCopyrightText: 2026 Alexandre 'kidev' Poumaroux
     SPDX-License-Identifier: Apache-2.0

     The editor's one page. Nothing is inline: no script body, no style block, no handler
     attribute, and nothing loaded from anywhere but here, so the page runs under the policy
     the server sends it with (default-src 'none' and 'self' for the rest, no unsafe-inline).
     design.js finds every element below by id and attaches every listener. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Brand first, the way every page of the site titles itself (overrides/main.html), so a
         tab holding the editor sits beside the tabs holding the guide rather than sorting
         somewhere else. -->
    <title>SynQt - Design editor</title>
    <!-- The same icon file the site is served with, so the two are one tab icon rather than
         two. Named, because a browser that is not told asks for /favicon.ico and the server
         has no such file to give it. -->
    <link rel="icon" href="synqt.ico" sizes="any">
    <link rel="stylesheet" href="design.css">
    <!-- The file pane's editor lives in a shadow root and adopts this itself. Named here as
         well so the browser has it before the pane is built rather than after. -->
    <link rel="preload" as="style" href="editor.css">
    <script type="module" src="design.js"></script>
  </head>
  <body>
    <header class="bar">
      <!-- The way out, where a logo in the corner of a page always goes. It asks before it
           goes anywhere: a design lives in this tab, and leaving by mistake is how an
           afternoon is lost. design.js attaches that question; the href is what makes it a
           link a browser can open in a new tab, and what it falls back to. -->
      <a class="bar__home" id="home" href="/" title="Back to synqt.org">
        <img class="bar__mark" src="synqt.svg" alt="SynQt" width="284" height="150">
        <span class="bar__wordmark">Designer</span>
      </a>
      <!-- The project's own name, and the one thing in this bar that is not a button: a
           double click opens it for editing where it is written, the way an entity's name
           on the canvas does. No verdict sits here. What the rules say is a list with a
           line per finding, and the rail holds it under Review where each line can be
           clicked back to the thing it is about. A count in the bar was the same news with
           nowhere to go. -->
      <span class="bar__project" id="project" hidden
            title="Double click to rename the project"></span>
      <!-- The way back over what was just done, and forward again. Beside the project's name
           rather than over with Review and Apply: those three are what happens to the project
           on disk, and these two are what happens on the canvas. design.js draws the arrows
           and enables each one only while there is a step that way to take. -->
      <span class="bar__history">
        <button type="button" class="button button--step" id="undo" disabled
                aria-label="Undo" title="Undo the last change (Ctrl-Z)"></button>
        <button type="button" class="button button--step" id="redo" disabled
                aria-label="Redo" title="Redo the change undone (Ctrl-Shift-Z)"></button>
      </span>
      <span class="bar__gap"></span>
      <button type="button" class="button button--danger" id="restart" hidden>Clear</button>
      <!-- The way back out of an edit to synqt.yaml, offered while that file is unlocked:
           every version of it that read cleanly is remembered, and this returns to the last
           one. It is what makes typing into the configuration something to try. -->
      <button type="button" class="button" id="revert" hidden>Back to the last good version</button>
      <button type="button" class="button" id="infer">Infer from the sources</button>
      <button type="button" class="button" id="review">Review changes</button>
      <button type="button" class="button button--go" id="apply" disabled>Apply</button>
    </header>

    <main class="work">
      <aside class="rail">
        <h2 class="rail__title">Add an entity</h2>
        <p class="rail__hint">Drag one onto the canvas, where you want it.</p>
        <div class="palette" id="palette"></div>
        <h2 class="rail__title">Review</h2>
        <ul class="findings findings--verdict" id="findings"></ul>
      </aside>

      <section class="stage">
        <div class="stage__canvas">
          <svg class="canvas" id="canvas" xmlns="http://www.w3.org/2000/svg">
            <!-- The boxes behind everything, then the links, so a line passes under a node
                 rather than across it, and the half-drawn one between them so it does the
                 same. -->
            <g id="viewport">
              <g id="zones"></g>
              <g id="links"></g>
              <g id="ghost"></g>
              <g id="nodes"></g>
            </g>
          </svg>
          <!-- What happened, said once and then gone. It is not where a reader learns what
               the drawing is: a situation worth acting on is marked on the entity or the
               connect point it is about, and hovering that mark is what says it. -->
          <p class="stage__hint" id="hint" role="status" aria-live="polite"></p>
        </div>

        <!-- The same project as text, open from the start: the files are what is being
             designed, not a second opinion about it. Redrawn from the document on every
             change, so it is never a snapshot of an older design, and the QML in it is typed
             into rather than read: what a Source declares is what its contract holds. Hiding
             it leaves the bar, which is what opens it again. -->
        <section class="dock" id="dock">
          <!-- One bar, saying each thing once: what the pane is, which file is open in it,
               the control that unlocks that file, and the chevron that puts the whole pane
               away. Nothing explains itself here: the button says what pressing it does and
               carries the longer version as its own tooltip, which is one line of prose
               fewer between the file name and the thing that opens the file. -->
          <!-- Split where the pane below it is split, so each half of the bar is the
               heading of the half under it: "Files" sits over the tree, and the file's own
               name sits over the file. The button that unlocks it comes first, before the
               name, because it is what this half of the bar is for -- the name is what is
               open, and the button is the thing to press. -->
          <header class="dock__bar" id="dock-bar">
            <span class="dock__title">Files</span>
            <span class="dock__file">
              <!-- Read-only until somebody says otherwise. The pane holds the entity's own
                   code, and a stray keystroke over a file you were reading is not an edit
                   anybody asked to make. -->
              <button type="button" class="button button--lock" id="source-lock"
                      aria-pressed="false"></button>
              <span class="dock__name" id="source-name"></span>
              <span class="bar__gap"></span>
              <button type="button" class="button button--chevron" id="dock-toggle"
                      aria-expanded="true" aria-controls="dock-pane"
                      aria-label="Collapse the files"></button>
            </span>
          </header>
          <div class="dock__pane" id="dock-pane">
            <ul class="tree" id="tree"></ul>
            <div class="source">
              <!-- Where the editor is built, and the whole of what this file says about it:
                   what goes in here is CodeMirror (vendor/README.md), wired up by editor.js
                   and coloured by source.js, which is the same reader that colours the
                   members written along a link on the canvas. -->
              <div class="source__view" id="source-view"></div>
            </div>
          </div>
        </section>
      </section>

      <!-- The panel for whatever is selected. On a narrow window it folds to the strip its
           handle sits on and opens over the canvas, rather than being dropped from the
           layout: everything that edits a selection is in here, so a page that can select a
           thing and not edit it is a page missing half of itself. The handle is always in
           the markup and shown only where the panel folds, so nothing has to be built at
           the moment the window is resized. -->
      <aside class="inspector" id="inspector">
        <button type="button" class="inspector__handle" id="inspector-handle"
                aria-expanded="false" aria-controls="inspector-body"
                aria-label="Show the panel"></button>
        <div class="inspector__body" id="inspector-body"></div>
      </aside>

      <!-- Where two panes meet, drawn as nothing and wider than it looks so the edge does not
           have to be hit exactly. Each one drags the width or height its pane is laid out
           from. -->
      <div class="grip grip--rail" id="grip-rail" role="separator"
           aria-orientation="vertical" aria-label="Resize the rail"></div>
      <div class="grip grip--inspector" id="grip-inspector" role="separator"
           aria-orientation="vertical" aria-label="Resize the panel"></div>
      <div class="grip grip--dock" id="grip-dock" role="separator"
           aria-orientation="horizontal" aria-label="Resize the files"></div>
    </main>

    <!-- What hovering something on the canvas opens, over whatever it was opened on. Filled
         by design.js and positioned at the pointer; it holds nothing until then. -->
    <div class="tip" id="tip" hidden></div>

    <!-- What a right click opens. -->
    <ul class="menu" id="menu" hidden></ul>

    <!-- What crosses a link, chosen from what its owner already declares. It opens on a link
         the moment one is drawn, because that is the question a new link asks. Nothing is
         ticked to begin with: a member reaches a consumer because somebody said so. -->
    <section class="picker" id="picker" hidden aria-label="What crosses this link"></section>

    <section class="sheet" id="sheet" hidden>
      <header class="sheet__bar">
        <h2 class="sheet__title" id="sheet-title">Changes</h2>
        <button type="button" class="button" id="sheet-close">Close</button>
      </header>
      <p class="sheet__git" id="sheet-git"></p>
      <ul class="findings" id="sheet-findings"></ul>
      <pre class="sheet__diff" id="sheet-diff"></pre>
    </section>
  </body>
</html>
