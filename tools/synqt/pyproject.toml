# The `synqt` distribution on PyPI. release.yml builds it from the same tag as the frozen
# binaries.

[build-system]
# setuptools 77 for PEP 639 license metadata.
requires = ["setuptools>=77"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "synqt"
description = "The SynQt CLI: scaffold, build, check, serve, and run a SynQt project."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The SynQt Authors" }]
maintainers = [{ name = "Alexandre 'kidev' Poumaroux" }]
keywords = ["qt", "qml", "webassembly", "wasm", "framework", "cli", "web", "qt6"]
dependencies = ["PyYAML>=6.0"]

# The version lives in synqt/_version.py only.
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Programming Language :: JavaScript",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://synqt.org/"
Documentation = "https://synqt.org/getting-started/"
Repository = "https://github.com/Kidev/SynQt"
Issues = "https://github.com/Kidev/SynQt/issues"
Changelog = "https://github.com/Kidev/SynQt/releases"

[project.scripts]
synqt = "synqt.cli:main"

[tool.setuptools]
packages = ["synqt"]

[tool.setuptools.dynamic]
version = { attr = "synqt._version.__version__" }

[tool.setuptools.package-data]
# `assets/` holds the loading page and the design editor. `framework/` is the vendored src/
# and cmake/, written by _build_backend.py.
synqt = ["assets/**/*", "framework/**/*"]

# Branch coverage of the package. Run through tests/run-coverage.sh.
[tool.coverage.run]
source = ["synqt"]
branch = true
omit = ["synqt/assets/*", "synqt/framework/*", "synqt/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    # Defensive branches reachable only on a broken install.
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
