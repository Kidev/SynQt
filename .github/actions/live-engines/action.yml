# The real database, cache and document engines the M9 provider proofs need, each answering
# plaintext and TLS, plus the QMYSQL plugin rebuilt against MariaDB Connector/C. Linux only
# and best effort. An engine that does not come up leaves its proof skipping. Results reach
# the calling job through GITHUB_ENV.

name: Live provider engines
description: Start the throwaway engines the live provider proofs need, and build QMYSQL against Connector/C

inputs:
  qt_version:
    description: Qt version, to locate the kit and its sources
    required: true
  qt_root:
    description: Directory the Qt kit is installed into
    required: true
  kit_dir:
    description: Directory the kit installs into under $QT_ROOT/$QT_VERSION
    required: true

runs:
  using: composite
  steps:
    # Qt's prebuilt QMYSQL links Oracle's libmysqlclient, which SynQt may not convey beside
    # the LGPLv3 Qt modules (docs/licensing.md). Tools/qmysql-plugin/build-qmysql-plugin.sh
    # rebuilds it against Connector/C from the Qt sources.
    - name: Cache the QMYSQL plugin built against Connector/C
      if: runner.os == 'Linux'
      id: qmysql-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/synqt-qmysql
        key: qmysql-${{ runner.os }}-${{ inputs.qt_version }}-${{ hashFiles('tools/qmysql-plugin/build-qmysql-plugin.sh') }}

    - name: Build the QMYSQL plugin against MariaDB Connector/C (best effort)
      if: runner.os == 'Linux'
      shell: bash
      env:
        QT_HOST: ${{ inputs.qt_root }}/${{ inputs.qt_version }}/${{ inputs.kit_dir }}
        QT_SRC: ${{ inputs.qt_root }}/${{ inputs.qt_version }}/Src
        QT_VERSION: ${{ inputs.qt_version }}
        QT_ROOT: ${{ inputs.qt_root }}
        CACHED: ${{ steps.qmysql-cache.outputs.cache-hit }}
      run: |
        set -u
        sudo apt-get install -y libmariadb-dev || true
        if [ "$CACHED" = "true" ] && [ -n "$(find "$HOME/.cache/synqt-qmysql" -name 'libqsqlmysql.so' 2>/dev/null)" ]; then
          echo "QMYSQL plugin restored from cache"
        else
          if python -m aqt install-src linux "$QT_VERSION" --archives qtbase \
              --outputdir "$QT_ROOT"; then
            tools/qmysql-plugin/build-qmysql-plugin.sh ||
                echo "::warning::the QMYSQL plugin did not build; the live mysql proof will skip"
          else
            echo "::warning::the Qt sources did not install; the live mysql proof will skip"
          fi
        fi
        if [ -n "$(find "$HOME/.cache/synqt-qmysql" -name 'libqsqlmysql.so' 2>/dev/null)" ]; then
          echo "QT_PLUGIN_PATH=$HOME/.cache/synqt-qmysql" >> "$GITHUB_ENV"
        fi

    # The same script a workstation runs; it exports SYNQT_TEST_* only for engines that answer.
    - name: Start throwaway engines for the live provider proofs (best effort)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -u
        tests/lib/live-engines.sh up ||
            echo "::warning::the live engines did not start; their proofs will skip"
        tests/lib/live-engines.sh github-env >> "$GITHUB_ENV"
