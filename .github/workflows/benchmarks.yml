# Build and run the benchmark harnesses and check their output against the ratios and
# orderings in benchmarks/baselines.py. capstone, edge, client, remote-pages and
# vs-frameworks do not run here.

name: "[BENCH] Run the benchmark harnesses"

on:
  workflow_dispatch:
  push:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yml"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep identical across every workflow. Tools/synqt/tests/test_qt_pin.py fails when one drifts.
  AQT_VERSION: "16db45a70b5905ad596941b223469bc86a56901e"

jobs:
  benchmarks:
    name: benchmarks (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_VERSION: "6.12.0"
      QT_ROOT: ${{ github.workspace }}/Qt
      QT_MODULES: "qtwebsockets qtremoteobjects qthttpserver qtnetworkauth qttasktree"
      JWT_CPP_VERSION: "v0.7.2"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools (CMake + Ninja)
        uses: lukka/get-cmake@v4.4.2

      - name: Install the native dependencies Qt needs to configure
        # Qt6Gui's plugin scan needs OpenGL and Wayland.
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libgl1-mesa-dev libwayland-dev libwayland-bin

      - name: Provide jwt-cpp headers
        run: |
          set -eu
          git clone --depth 1 --branch "$JWT_CPP_VERSION" \
            https://github.com/Thalhammer/jwt-cpp "$RUNNER_TEMP/jwt-cpp"
          echo "JWT_CPP_INCLUDE_DIR=$RUNNER_TEMP/jwt-cpp/include" >> "$GITHUB_ENV"

      - name: Cache the Qt kit
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-benchmarks-${{ env.QT_VERSION }}-${{ hashFiles('.github/workflows/benchmarks.yml') }}

      - name: Install aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@${{ env.AQT_VERSION }}"

      - name: Install the Qt host kit and its add-on modules
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          kit="$QT_ROOT/$QT_VERSION/gcc_64"
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir "$QT_ROOT"
          for m in $QT_MODULES; do
            python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
              -m "$m" --outputdir "$QT_ROOT" \
              || echo "prebuilt $m unavailable; will try a source build"
          done

          pkg_for() {
            case "$1" in
              qtwebsockets)    echo Qt6WebSockets ;;
              qtremoteobjects) echo Qt6RemoteObjects ;;
              qthttpserver)    echo Qt6HttpServer ;;
              qtnetworkauth)   echo Qt6NetworkAuth ;;
              qttasktree)      echo Qt6TaskTree ;;
            esac
          }
          for m in $QT_MODULES; do
            pkg="$(pkg_for "$m")"
            if [ -z "$pkg" ]; then
              echo "::error::QT_MODULES lists '$m' but pkg_for() has no package name for it"
              exit 1
            fi
            if [ -f "$kit/lib/cmake/$pkg/${pkg}Config.cmake" ]; then
              echo "$m present ($pkg)"
              continue
            fi
            echo "$m missing; building it from source into the kit"
            python -m aqt install-src linux "$QT_VERSION" --archives "$m" --outputdir "$QT_ROOT"
            "$kit/bin/qt-cmake" -S "$QT_ROOT/$QT_VERSION/Src/$m" -B "$RUNNER_TEMP/$m-build" \
              -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$kit"
            cmake --build "$RUNNER_TEMP/$m-build"
            cmake --install "$RUNNER_TEMP/$m-build"
          done

      - name: Run the harnesses
        env:
          QT_HOST: ${{ env.QT_ROOT }}/${{ env.QT_VERSION }}/gcc_64
          FRESH: ${{ github.workspace }}/benchmark-run
        run: |
          set -u -o pipefail
          mkdir -p "$FRESH"

          # Shorter sweeps than the committed baselines.
          run_one() {
            name="$1"
            shift
            echo "::group::$name"
            log="$RUNNER_TEMP/$name.log"
            if BENCH_OUT="$FRESH/$name.json" bash "benchmarks/$name/run-bench.sh" "$@" 2>&1 \
                | tee "$log"; then
              echo "PASS $name"
            else
              echo "FAIL $name"
              echo "$name" >> "$RUNNER_TEMP/failed"
            fi
            if grep -q "CMake Warning" "$log"; then
              echo "::error::$name produced CMake warnings"
              echo "$name (CMake warning)" >> "$RUNNER_TEMP/failed"
            fi
            echo "::endgroup::"
          }

          run_one transport   --samples 1000 --throughput-calls 20000
          run_one mesh        --samples 1000 --setup-samples 100 --throughput-calls 20000
          run_one sessions    --iterations 200000 --sizes 1000,10000,100000
          run_one persistence --autocommit-rows 2000 --reads 5000 --contended-rows 1000
          run_one fanout      --sizes 10,25,50 --ticks 100 --interest 16
          run_one monitor     --batches 40 --batch-size 2000

          if [ -f "$RUNNER_TEMP/failed" ]; then
            echo "::error::harnesses that did not complete: $(tr '\n' ' ' < "$RUNNER_TEMP/failed")"
            exit 1
          fi

      - name: Hold the fresh results to the claims the README makes
        env:
          FRESH: ${{ github.workspace }}/benchmark-run
        run: python benchmarks/baselines.py check "$FRESH"/*.json --verbose

      - name: Compare against a baseline from this same machine, if there is one
        env:
          FRESH: ${{ github.workspace }}/benchmark-run
        run: |
          set -u
          tag="$(hostname | tr -c 'A-Za-z0-9_.-' '_')"
          compared=0
          status=0
          for fresh in "$FRESH"/*.json; do
            name="$(basename "$fresh" .json)"
            baseline="benchmarks/results/$name-$tag.json"
            if [ ! -f "$baseline" ]; then
              continue
            fi
            echo "::group::$name against $baseline"
            python benchmarks/baselines.py compare "$baseline" "$fresh" || status=1
            compared=$((compared + 1))
            echo "::endgroup::"
          done
          if [ "$compared" -eq 0 ]; then
            echo "no committed baseline for host tag '$tag'."
            echo "Absolute numbers only compare on one machine, so nothing is compared here;"
            echo "the invariant check in the previous step is this runner's gate."
          fi
          exit "$status"

      - name: Keep the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-run
          path: benchmark-run/
          if-no-files-found: warn
