name: "[DOCS] Deploy docs to GitHub Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # tools/docs-hooks/doxygen.py generates the C++ reference; Graphviz draws its diagrams.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      # Pinned to a release, not apt's. Tools/docs-hooks/doxygen.py patches its navtree.js.
      - name: Install the pinned Doxygen
        env:
          DOXYGEN_VERSION: "1.16.1"
          # The SHA-256 of the tarball. Bump both together.
          DOXYGEN_SHA256: "a56f885d37e3aae08a99f638d17bbb381224c03a878d9e2dda4f9fa4baf1d8bd"
        run: |
          set -euo pipefail
          tag="Release_${DOXYGEN_VERSION//./_}"
          archive="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/doxygen/doxygen/releases/download/$tag/$archive"
          echo "$DOXYGEN_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin"
          "$bin/doxygen" --version
          echo "$bin" >> "$GITHUB_PATH"

      - name: Build site
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict --site-dir _site

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
