name: "[DOCS] Deploy docs to GitHub Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only for the workflow. The two writes the official Pages deployment needs are granted
# to the job that deploys and to nothing else, so the job that runs mkdocs, Doxygen and the
# hooks over the tree cannot publish a site.
permissions:
  contents: read

# Allow one concurrent deployment; do not cancel a run in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0          # full history, in case theme features use git dates

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The C++ runtime reference under /api/ is generated by the MkDocs hook in
      # tools/docs-hooks/doxygen.py. Without these the site still builds, but with the
      # reference missing; Graphviz supplies the inheritance diagrams.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      # Doxygen comes from its own release, pinned, and not from apt. The distribution
      # package is whatever the runner image's Ubuntu froze (1.9.8 on noble), which is far
      # enough behind that Doxyfile settings are rejected as unknown tags and, worse, the
      # generated navtree.js no longer looks like what tools/docs-hooks/doxygen.py patches:
      # the hook logged a warning, skipped its fix, and the published sidebar kept a stale
      # selection while every local build looked right. Pinning is what makes a local
      # reference build and the published one the same artifact.
      - name: Install the pinned Doxygen
        env:
          DOXYGEN_VERSION: "1.16.1"
          # The SHA-256 of the tarball below. Bump both together, in one reviewed edit.
          DOXYGEN_SHA256: "a56f885d37e3aae08a99f638d17bbb381224c03a878d9e2dda4f9fa4baf1d8bd"
        run: |
          set -euo pipefail
          tag="Release_${DOXYGEN_VERSION//./_}"
          archive="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/doxygen/doxygen/releases/download/$tag/$archive"
          echo "$DOXYGEN_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin"
          # Printed so a log answers "which Doxygen built this?" without archaeology.
          "$bin/doxygen" --version
          echo "$bin" >> "$GITHUB_PATH"

      - name: Build site
        env:
          # Silences the mkdocs-material package's startup nag about MkDocs 2.0;
          # it prints on every invocation of the mkdocs binary regardless of project.
          NO_MKDOCS_2_WARNING: "true"
        # --strict so the link validation configured in mkdocs.yml fails the build instead
        # of printing a warning nobody reads: a renamed heading silently breaks every link
        # to its anchor, and the site publishes anyway.
        run: mkdocs build --strict --site-dir _site

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the built site
      id-token: write # the OIDC token actions/deploy-pages trades for a deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
