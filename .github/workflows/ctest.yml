# Build and run the native C++ suites through tests/run-all.sh on Linux, macOS and Windows.
# tests/CMakeLists.txt is the registry of suites. This file keeps no list of its own.

name: "[TEST] Build and test the C++ runtime"

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ctest-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep AQT_VERSION, QT_VERSION and EM_VERSION identical across every workflow;
  # tools/synqt/tests/test_qt_pin.py fails when one drifts.
  AQT_VERSION: "16db45a70b5905ad596941b223469bc86a56901e"
  QT_VERSION: "6.12.0"
  QT_ROOT: ${{ github.workspace }}/Qt
  # qttasktree and qtquicktimeline silence the Qml plugin scan's warnings.
  QT_MODULES: "qtwebsockets qtremoteobjects qthttpserver qtnetworkauth qttasktree qtquick3d qtquicktimeline qtshadertools"
  # At least v0.7.1.
  JWT_CPP_VERSION: "v0.7.2"
  QT_QPA_PLATFORM: offscreen

jobs:
  # Gates the jobs with `if:`, never `paths:`, so required checks still report.
  changes:
    name: Decide what this run has to build
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: decide
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          bash .github/scripts/relevant-changes.sh \
              "src/" \
              "tests/" \
              "cmake/" \
              "tools/synqtc/" \
              "tools/coverage/" \
              ".github/workflows/ctest.yml" \
              ".github/actions/qt-kit/action.yml" \
              ".github/actions/live-engines/action.yml" \
              ".github/scripts/relevant-changes.sh" >> "$GITHUB_OUTPUT"

      - id: matrix
        run: |
          {
            echo -n 'value={"include":['
            echo -n '{"os":"ubuntu-24.04","label":"linux","aqt_host":"linux","aqt_arch":"linux_gcc_64","kit_dir":"gcc_64"},'
            echo -n '{"os":"macos-15","label":"macos","aqt_host":"mac","aqt_arch":"clang_64","kit_dir":"macos"},'
            echo -n '{"os":"windows-2025","label":"windows","aqt_host":"windows","aqt_arch":"win64_msvc2022_64","kit_dir":"msvc2022_64"}'
            echo ']}'
          } >> "$GITHUB_OUTPUT"

  # Phases [1/3] and [2/3] of tests/run-all.sh. The shared tree and its ctest suites.
  tree:
    name: tree (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/qt-kit
        with:
          label: ${{ matrix.label }}
          phase: tree
          aqt_host: ${{ matrix.aqt_host }}
          aqt_arch: ${{ matrix.aqt_arch }}
          kit_dir: ${{ matrix.kit_dir }}
          qt_version: ${{ env.QT_VERSION }}
          qt_root: ${{ env.QT_ROOT }}
          qt_modules: ${{ env.QT_MODULES }}
          jwt_cpp_version: ${{ env.JWT_CPP_VERSION }}
          aqt_version: ${{ env.AQT_VERSION }}

      - uses: ./.github/actions/live-engines
        with:
          qt_version: ${{ env.QT_VERSION }}
          qt_root: ${{ env.QT_ROOT }}
          kit_dir: ${{ matrix.kit_dir }}
          aqt_version: ${{ env.AQT_VERSION }}

      - name: Build the tree and run its ctest suites
        shell: bash
        env:
          QT_HOST: ${{ env.QT_ROOT }}/${{ env.QT_VERSION }}/${{ matrix.kit_dir }}
        run: |
          set -u -o pipefail

          # Windows has no RPATH: the test binaries find the Qt DLLs through PATH.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$(cygpath -u "$QT_HOST")/bin:$PATH"
          fi

          SYNQT_PHASES=tree bash tests/run-all.sh

      # QtTest on arm64 macOS leaves a crash to the system reporter, which writes the stack here.
      - name: Print the stack of each crashed test
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          set -u
          shopt -s nullglob
          for report in "$HOME"/Library/Logs/DiagnosticReports/tst_*.ips; do
            echo "::group::$(basename "$report")"
            python3 - "$report" <<'PY'
          import json, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          body = json.loads(text[text.index("\n") + 1:])
          images = body.get("usedImages", [])
          print(body.get("exception", {}), body.get("termination", {}).get("indicator", ""))
          thread = body["threads"][body.get("faultingThread", 0)]
          for number, frame in enumerate(thread.get("frames", [])):
              index = frame.get("imageIndex", -1)
              image = images[index].get("name", "?") if 0 <= index < len(images) else "?"
              symbol = frame.get("symbol", hex(frame.get("imageOffset", 0)))
              print(f"#{number:<3} {image:<28} {symbol}+{frame.get('symbolLocation', 0)}")
          PY
            echo "::endgroup::"
          done

      - name: Report what the compiler cache did
        if: always()
        shell: bash
        run: |
          set -u
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

  # Phase [3/3] of tests/run-all.sh: the suites that compile generated code.
  generated:
    name: generated (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/qt-kit
        with:
          label: ${{ matrix.label }}
          phase: generated
          aqt_host: ${{ matrix.aqt_host }}
          aqt_arch: ${{ matrix.aqt_arch }}
          kit_dir: ${{ matrix.kit_dir }}
          qt_version: ${{ env.QT_VERSION }}
          qt_root: ${{ env.QT_ROOT }}
          qt_modules: ${{ env.QT_MODULES }}
          jwt_cpp_version: ${{ env.JWT_CPP_VERSION }}
          aqt_version: ${{ env.AQT_VERSION }}

      - name: Compile and run the generated-output suites
        shell: bash
        env:
          QT_HOST: ${{ env.QT_ROOT }}/${{ env.QT_VERSION }}/${{ matrix.kit_dir }}
        run: |
          set -u -o pipefail

          # Windows has no RPATH: the test binaries find the Qt DLLs through PATH.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$(cygpath -u "$QT_HOST")/bin:$PATH"
          fi

          SYNQT_PHASES=generated bash tests/run-all.sh

      # QtTest on arm64 macOS leaves a crash to the system reporter, which writes the stack here.
      - name: Print the stack of each crashed test
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          set -u
          shopt -s nullglob
          for report in "$HOME"/Library/Logs/DiagnosticReports/tst_*.ips; do
            echo "::group::$(basename "$report")"
            python3 - "$report" <<'PY'
          import json, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          body = json.loads(text[text.index("\n") + 1:])
          images = body.get("usedImages", [])
          print(body.get("exception", {}), body.get("termination", {}).get("indicator", ""))
          thread = body["threads"][body.get("faultingThread", 0)]
          for number, frame in enumerate(thread.get("frames", [])):
              index = frame.get("imageIndex", -1)
              image = images[index].get("name", "?") if 0 <= index < len(images) else "?"
              symbol = frame.get("symbol", hex(frame.get("imageOffset", 0)))
              print(f"#{number:<3} {image:<28} {symbol}+{frame.get('symbolLocation', 0)}")
          PY
            echo "::endgroup::"
          done

      - name: Report what the compiler cache did
        if: always()
        shell: bash
        run: |
          set -u
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi

  # A second, instrumented build of the tree; Linux only, since gcov is per toolchain.
  coverage:
    name: coverage (linux)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/qt-kit
        with:
          label: linux
          phase: coverage
          aqt_host: linux
          aqt_arch: linux_gcc_64
          kit_dir: gcc_64
          qt_version: ${{ env.QT_VERSION }}
          qt_root: ${{ env.QT_ROOT }}
          qt_modules: ${{ env.QT_MODULES }}
          jwt_cpp_version: ${{ env.JWT_CPP_VERSION }}
          aqt_version: ${{ env.AQT_VERSION }}

      - uses: ./.github/actions/live-engines
        with:
          qt_version: ${{ env.QT_VERSION }}
          qt_root: ${{ env.QT_ROOT }}
          kit_dir: gcc_64
          aqt_version: ${{ env.AQT_VERSION }}

      - name: Measure and enforce the C++ coverage floor
        shell: bash
        env:
          QT_HOST: ${{ env.QT_ROOT }}/${{ env.QT_VERSION }}/gcc_64
          # Raise it when the number goes up. Never lower it to make a branch green.
          CXX_FLOOR: "78"
          HALVES: cxx
          BUILD_DIR: build/coverage
        run: bash tests/run-coverage.sh

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-cxx
          path: build/coverage/coverage-cxx.json
          if-no-files-found: ignore

      - name: Report what the compiler cache did
        if: always()
        shell: bash
        run: |
          set -u
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          fi
