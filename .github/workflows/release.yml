# SPDX-FileCopyrightText: 2026 Alexandre 'kidev' Poumaroux
# SPDX-License-Identifier: Apache-2.0

# Freeze the synqt CLI into one binary per OS and architecture, publish them on a GitHub
# release, and upload the distribution to PyPI. install.sh downloads the assets by name.
# Linux is frozen inside manylinux_2_28, so its glibc floor is 2.28.

name: "[RELEASE] Publish a release of the synqt CLI"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Custom version (overrides the bump)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: false
      skip_pypi:
        description: "Don't upload to PyPI"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # get.synqt.org serves the installer at / and /install.sh.
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: index.html must be identical to install.sh
        run: |
          if ! diff -u deploy/get.synqt.org/install.sh deploy/get.synqt.org/index.html; then
            echo "::error::deploy/get.synqt.org/index.html must be a byte for byte copy of install.sh (run: cp deploy/get.synqt.org/install.sh deploy/get.synqt.org/index.html)"
            exit 1
          fi

  # Inputs reach scripts through the environment only, never interpolated.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
      pypi: ${{ steps.pep440.outputs.pypi }}
      pypi_version: ${{ steps.pep440.outputs.pypi_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Compute the next version
        id: compute
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_PYPI: ${{ inputs.skip_pypi }}
        run: |
          set -eu
          latest="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n1)"
          if [ -n "$CUSTOM_VERSION" ]; then
            version="${CUSTOM_VERSION#v}"
            if ! printf '%s\n' "$version" \
                | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+([-.+]?[0-9A-Za-z][0-9A-Za-z.+-]*)?'; then
              echo "::error::custom version must be MAJOR.MINOR.PATCH with an optional suffix: $version"
              exit 1
            fi
            echo "Custom version: $version (bump ignored)"
          else
            core="$(printf '%s\n' "${latest#v}" | grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+' || echo 0.0.0)"
            major="${core%%.*}"
            rest="${core#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::unknown bump: $BUMP"; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
            echo "Latest tag: ${latest:-none} -> $BUMP bump: $version"
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::tag v$version already exists"
            exit 1
          fi
          core="$(printf '%s\n' "$version" | grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+')"
          if [ "$version" = "$core" ]; then
            prerelease="false"
          else
            prerelease="true"
          fi
          echo "Version: $version (prerelease=$prerelease)"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run: v$version will be built and smoke-tested but NOT tagged or published"
          elif [ "$SKIP_PYPI" = "true" ]; then
            echo "::notice::Skipping PyPI: v$version will be tagged and released on GitHub only"
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # A version PEP 440 cannot express skips PyPI.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Decide whether this version is publishable to PyPI
        id: pep440
        env:
          SYNQT_VERSION: ${{ steps.compute.outputs.version }}
        run: |
          set -eu
          python -m pip install --quiet --disable-pip-version-check packaging
          python - <<'PY'
          import os

          from packaging.version import InvalidVersion, Version

          raw = os.environ["SYNQT_VERSION"]
          try:
              normalized = str(Version(raw))
          except InvalidVersion:
              publishable, normalized = "false", ""
              print(f"::notice::{raw} is not a PEP 440 version, so this release publishes "
                    "the GitHub assets only and skips PyPI.")
          else:
              publishable = "true"
              print(f"{raw} is a PEP 440 version (normalizes to {normalized}); PyPI is in.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"pypi={publishable}\npypi_version={normalized}\n")
          PY

  # The container is run directly rather than as the job `container:`, so the Actions run on
  # the host's glibc and only the freeze and smoke test happen inside the image.
  build-linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch_tag: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            arch_tag: arm64
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Stamp the CLI version
        shell: bash
        # Written by repr(): the value carries the free-form suffix.
        env:
          SYNQT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os

          version = os.environ["SYNQT_VERSION"]
          lines = [
              "# SPDX-FileCopyrightText: 2026 Alexandre 'kidev' Poumaroux",
              "# SPDX-License-Identifier: Apache-2.0",
              "",
              '"""Stamped by the release workflow. See tools/synqt/synqt/_version.py."""',
              "",
              "__version__ = " + repr(version),
              "",
          ]
          with open("tools/synqt/synqt/_version.py", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

      - name: Freeze and smoke-test inside manylinux_2_28 (glibc 2.28 floor)
        env:
          IMAGE: ${{ matrix.image }}
        # --collect-submodules for the lazily imported commands. The dnf python by absolute
        # path: PyInstaller refuses the static /opt/python builds. SYNQT_ROOT is the checkout
        # because a one-file binary deletes its data directory on exit. The container script
        # is single-quoted, so it must not contain a single quote.
        run: |
          set -eu
          docker run --rm -v "$PWD:/io" -w /io "$IMAGE" bash -euo pipefail -c '
            dnf install -y python3.12 python3.12-pip || dnf install -y python3.11 python3.11-pip
            if [ -x /usr/bin/python3.12 ]; then py=/usr/bin/python3.12; else py=/usr/bin/python3.11; fi
            "$py" -m pip install --root-user-action=ignore --upgrade pip
            "$py" -m pip install --root-user-action=ignore ./tools/synqt pyinstaller
            printf "import sys\nfrom synqt.cli import main\nif __name__ == \"__main__\":\n    sys.exit(main())\n" > synqt_entry.py
            "$py" -m PyInstaller --onefile --name synqt \
              --collect-submodules synqt --collect-data synqt synqt_entry.py
            ./dist/synqt --help
            tmp="$(mktemp -d)"
            SYNQT_ROOT=/io ./dist/synqt new smoketest --parent-dir "$tmp"
            test -f "$tmp/smoketest/synqt.yaml"
            ./dist/synqt providers
          '

      - name: Package the asset
        id: package
        run: |
          set -eu
          asset="synqt-linux-${{ matrix.arch_tag }}.tar.gz"
          mkdir -p out
          tar -C dist -czf "out/$asset" synqt
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      # Retried once; the retry overwrites a half-finished attempt.
      - uses: actions/upload-artifact@v7.0.1
        id: upload
        continue-on-error: true
        with:
          name: ${{ steps.package.outputs.asset }}
          path: out/${{ steps.package.outputs.asset }}
          if-no-files-found: error

      - name: Retry the upload if the artifact endpoint blipped
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.asset }}
          path: out/${{ steps.package.outputs.asset }}
          if-no-files-found: error
          overwrite: true

  build-native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            os_tag: macos
            arch_tag: x86_64
            ext: tar.gz
          - os: macos-15
            os_tag: macos
            arch_tag: arm64
            ext: tar.gz
          - os: windows-2025
            os_tag: windows
            arch_tag: x86_64
            ext: zip
          - os: windows-11-arm
            os_tag: windows
            arch_tag: arm64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Stamp the CLI version
        shell: bash
        # Written by repr(): the value carries the free-form suffix.
        env:
          SYNQT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os

          version = os.environ["SYNQT_VERSION"]
          lines = [
              "# SPDX-FileCopyrightText: 2026 Alexandre 'kidev' Poumaroux",
              "# SPDX-License-Identifier: Apache-2.0",
              "",
              '"""Stamped by the release workflow. See tools/synqt/synqt/_version.py."""',
              "",
              "__version__ = " + repr(version),
              "",
          ]
          with open("tools/synqt/synqt/_version.py", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

      - name: Install the CLI and PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install ./tools/synqt pyinstaller

      - name: Freeze synqt into a single binary
        shell: bash
        # --collect-submodules for the lazily imported commands.
        run: |
          set -eu
          printf 'import sys\nfrom synqt.cli import main\nif __name__ == "__main__":\n    sys.exit(main())\n' > synqt_entry.py
          pyinstaller --onefile --name synqt --collect-submodules synqt --collect-data synqt synqt_entry.py

      - name: Smoke-test the frozen binary
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin=./dist/synqt.exe
          else
            bin=./dist/synqt
          fi
          "$bin" --help
          # Native paths only: the Windows .exe does not resolve MSYS paths.
          mkdir -p smoke-out
          SYNQT_ROOT="$GITHUB_WORKSPACE" "$bin" new smoketest --parent-dir smoke-out
          test -f smoke-out/smoketest/synqt.yaml
          "$bin" providers

      - name: Package the asset
        id: package
        shell: bash
        run: |
          set -eu
          asset="synqt-${{ matrix.os_tag }}-${{ matrix.arch_tag }}.${{ matrix.ext }}"
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path dist/synqt.exe -DestinationPath out/$asset -Force"
          else
            tar -C dist -czf "out/$asset" synqt
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      # Retried once, as in build-linux.
      - uses: actions/upload-artifact@v7.0.1
        id: upload
        continue-on-error: true
        with:
          name: ${{ steps.package.outputs.asset }}
          path: out/${{ steps.package.outputs.asset }}
          if-no-files-found: error

      - name: Retry the upload if the artifact endpoint blipped
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.asset }}
          path: out/${{ steps.package.outputs.asset }}
          if-no-files-found: error
          overwrite: true

  # Built apart from the upload, so only publish-pypi holds the OIDC token.
  build-pypi:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Stamp the CLI version
        # Written by repr(). pyproject.toml reads the version from this file.
        env:
          SYNQT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os

          version = os.environ["SYNQT_VERSION"]
          lines = [
              "# SPDX-FileCopyrightText: 2026 Alexandre 'kidev' Poumaroux",
              "# SPDX-License-Identifier: Apache-2.0",
              "",
              '"""Stamped by the release workflow. See tools/synqt/synqt/_version.py."""',
              "",
              "__version__ = " + repr(version),
              "",
          ]
          with open("tools/synqt/synqt/_version.py", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

      - name: Build the sdist and the wheel
        # From the checkout root: the build backend vendors src/ and cmake/.
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --outdir dist tools/synqt

      - name: Check the distributions and confirm they carry the framework
        run: |
          set -eu
          python -m twine check dist/*
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for required in ("synqt/framework/cmake/SynQtContracts.cmake",
                           "synqt/framework/examples/stall/synqt.yaml",
                           "synqt/assets/favicon.svg",
                           "synqt/assets/design/index.html"):
              if required not in names:
                  sys.exit(f"{wheel} is missing {required}")
          print(f"{wheel}: {len(names)} files, framework and assets present")
          PY

      # Retried once, as in build-linux.
      - uses: actions/upload-artifact@v7.0.1
        id: upload
        continue-on-error: true
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

      - name: Retry the upload if the artifact endpoint blipped
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          overwrite: true

  # Tags and releases as SynQt-Operations.
  release:
    needs: [installer, version, build-linux, build-native, build-pypi]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Mint a token for the SynQt-Operations app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNQT_CLIENT_ID }}
          private-key: ${{ secrets.SYNQT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7.0.1

      - name: Download all build assets
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List the assets to publish
        run: ls -la dist

      - name: Publish the release and tag the build commit
        uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.version.outputs.tag }}
          name: SynQt ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*

  # Trusted publishing matches this file's name: renaming it breaks publishing.
  publish-pypi:
    needs: [version, build-pypi, release]
    if: ${{ !inputs.dry_run && !inputs.skip_pypi && needs.version.outputs.pypi == 'true' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/synqt
    permissions:
      id-token: write
    steps:
      - name: Refuse to publish on a dry run or with PyPI skipped
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_PYPI: ${{ inputs.skip_pypi }}
          PYPI_VERSION: ${{ needs.version.outputs.pypi_version }}
        run: |
          set -eu
          if [ "$DRY_RUN" = "true" ]; then
            echo "::error::publish-pypi reached on a dry run; refusing to upload"
            exit 1
          fi
          if [ "$SKIP_PYPI" = "true" ]; then
            echo "::error::publish-pypi reached with skip_pypi set; refusing to upload"
            exit 1
          fi
          echo "not a dry run: publishing $PYPI_VERSION to PyPI"

      - name: Download the distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: pypi-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
