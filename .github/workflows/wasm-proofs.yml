# The WebAssembly proofs. Each job builds QtRemoteObjects into its kit.

name: "[TEST] Verify the WebAssembly client proofs"

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/transport-spike/verify/run-mt.sh"
      - "tests/transport-spike/verify/verify-mt.mjs"
      - "tests/wasm-quick3dphysics/**"
      - "tests/client/**"
      - "tests/plaza-browser/**"
      - "examples/arena/**"
      - "examples/plaza/**"
      - "tools/synqtc/**"
      - "src/client/**"
      - "tools/synqt/synqt/clientbuild.py"
      - "tools/synqt/synqt/clientmodules.py"
      - "tools/synqt/synqt/cmakegen.py"
      - "tools/synqt/synqt/build.py"
      - "src/edge/**"
      - ".github/workflows/wasm-proofs.yml"

permissions:
  contents: read

concurrency:
  group: wasm-proofs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep identical across every workflow: tools/synqt/tests/test_qt_pin.py fails when one drifts.
  AQT_VERSION: "16db45a70b5905ad596941b223469bc86a56901e"
  JWT_CPP_VERSION: "v0.7.2"

jobs:
  proof:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: multithread-sab
            kit: wasm_multithread
            needs_qtremoteobjects: true
            qt_modules: qtwebsockets
            browsers: chromium firefox webkit
            script: tests/transport-spike/verify/run-mt.sh
            verify_dir: tests/transport-spike/verify
          - label: physics-single
            kit: wasm_singlethread
            needs_qtremoteobjects: false
            qt_modules: qtquick3d qtquick3dphysics qtquicktimeline qtshadertools
            script: tests/wasm-quick3dphysics/verify/run-phys.sh
            verify_dir: tests/wasm-quick3dphysics/verify
          - label: physics-multi
            kit: wasm_multithread
            needs_qtremoteobjects: false
            qt_modules: qtquick3d qtquick3dphysics qtquicktimeline qtshadertools
            script: tests/wasm-quick3dphysics/verify/run-phys-mt.sh
            verify_dir: tests/wasm-quick3dphysics/verify
          - label: client-runtime
            kit: wasm_singlethread
            needs_qtremoteobjects: true
            needs_jwt_cpp: true
            qt_modules: qtwebsockets
            browsers: chromium firefox webkit
            script: tests/client/run-client.sh
            verify_dir: tests/client/verify
          - label: plaza-browser
            kit: wasm_singlethread
            needs_qtremoteobjects: true
            needs_jwt_cpp: true
            needs_cli: true
            qt_modules: qtwebsockets qtquick3d qtquick3dphysics qtquicktimeline qtshadertools
            browsers: chromium
            script: tests/plaza-browser/run-plaza-browser.sh
            verify_dir: tests/plaza-browser/verify
    env:
      QT_VERSION: "6.12.0"
      EM_VERSION: "5.0.5"
      QT_ROOT: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"

      - name: Install build tools (CMake + Ninja)
        uses: lukka/get-cmake@v4.4.2

      - name: Install the native dependencies the host Qt kit needs to configure
        # OpenGL and Wayland for Qt6Gui's plugin scan; Mesa and GLX/EGL for WebGL.
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgl1-mesa-dri \
            libglx-mesa0 libegl1 libegl-mesa0 libgbm1 \
            libwayland-dev libwayland-bin
          for w in wayland-client wayland-server wayland-cursor wayland-egl; do
            if ! pkg-config --exists "$w"; then
              echo "::error::$w is missing, so Qt6WaylandClient and with it Qt6Gui would not be found"
              exit 1
            fi
          done

      - name: Cache the Qt kit
        # Covers the from-source QtRemoteObjects too, which installs into the kit prefix.
        id: qt-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ matrix.label }}-${{ env.QT_VERSION }}-${{ hashFiles('.github/workflows/wasm-proofs.yml') }}

      - name: Install aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        # A pinned commit, not a release. No released aqt can install the Windows kit
        # (toolchain.AQT_VERSION).
        run: |
          python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@${{ env.AQT_VERSION }}"

      - name: Install Qt host kit (desktop)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        # qttasktree is not linked. The Qml plugin scan warns without it.
        run: |
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            -m qtwebsockets qtremoteobjects qthttpserver qtnetworkauth \
              qtquick3d qtquick3dphysics qtquicktimeline qtshadertools qttasktree \
            --outputdir "$QT_ROOT"

      - name: Install Qt WebAssembly kit (${{ matrix.kit }})
        if: steps.qt-cache.outputs.cache-hit != 'true'
        # The WASM kit is published under all_os/wasm, not under the host's desktop target.
        run: |
          python -m aqt install-qt all_os wasm "$QT_VERSION" ${{ matrix.kit }} \
            -m ${{ matrix.qt_modules }} \
            --outputdir "$QT_ROOT"
          bash .github/scripts/fix-wasm-kit-permissions.sh \
            "$QT_ROOT/$QT_VERSION/${{ matrix.kit }}"

      - name: Cache Emscripten
        id: emsdk-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EM_VERSION }}-${{ hashFiles('.github/workflows/wasm-proofs.yml') }}

      - name: Install and activate Emscripten ${{ env.EM_VERSION }}
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EM_VERSION"
          "$HOME/emsdk/emsdk" activate "$EM_VERSION"

      - name: Install Qt sources for QtRemoteObjects
        if: matrix.needs_qtremoteobjects && steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m aqt install-src linux "$QT_VERSION" \
            --archives qtremoteobjects --outputdir "$QT_ROOT"

      - name: Build QtRemoteObjects into the ${{ matrix.kit }} kit
        # The prebuilt WASM kits ship no QtRemoteObjects. Qt-cmake, since the kit's
        # qt-configure-module is broken on Linux.
        if: matrix.needs_qtremoteobjects && steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          QT_WASM="$QT_ROOT/$QT_VERSION/${{ matrix.kit }}"
          # The all_os/wasm kit carries Qt's own build-machine host path, so name the host tools.
          export QT_HOST_PATH="$QT_ROOT/$QT_VERSION/gcc_64"
          "$QT_WASM/bin/qt-cmake" -S "$QT_ROOT/$QT_VERSION/Src/qtremoteobjects" \
            -B "$RUNNER_TEMP/qtro-wasm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$QT_WASM"
          cmake --build "$RUNNER_TEMP/qtro-wasm"
          cmake --install "$RUNNER_TEMP/qtro-wasm"

      - name: Provide jwt-cpp headers
        if: matrix.needs_jwt_cpp
        shell: bash
        run: |
          set -eu
          git clone --depth 1 --branch "$JWT_CPP_VERSION" https://github.com/Thalhammer/jwt-cpp \
            "$RUNNER_TEMP/jwt-cpp"
          echo "JWT_CPP_INCLUDE_DIR=$RUNNER_TEMP/jwt-cpp/include" >> "$GITHUB_ENV"

      - name: Install the CLI's Python dependencies
        if: matrix.needs_cli
        run: |
          python -m pip install pyyaml brotli

      - name: Install the browser engines for the headless driver
        env:
          VERIFY_DIR: ${{ matrix.verify_dir }}
          BROWSERS: ${{ matrix.browsers || 'chromium' }}
        run: |
          set -euo pipefail
          cd "$VERIFY_DIR"
          npm install --no-audit --no-fund
          # shellcheck disable=SC2086
          npx playwright install --with-deps $BROWSERS

      - name: Run ${{ matrix.script }}
        env:
          QT_HOST: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/gcc_64
          QT_WASM: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ matrix.kit }}
          QT_WASM_MT: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ matrix.kit }}
          QT_HOST_PATH: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/gcc_64
          # No GPU on a runner; Mesa's software rasteriser gives the browsers their WebGL context.
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          ${{ matrix.script }}

  # Asserts the bundle on disk: a build that skipped compilation still exits 0.
  example-bundle:
    name: example-bundle (arena, wasm)
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: "6.12.0"
      EM_VERSION: "5.0.5"
      QT_ROOT: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools (CMake + Ninja)
        uses: lukka/get-cmake@v4.4.2

      - name: Install the native dependencies the host Qt kit needs to configure
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libwayland-bin
          for w in wayland-client wayland-server wayland-cursor wayland-egl; do
            if ! pkg-config --exists "$w"; then
              echo "::error::$w is missing, so Qt6WaylandClient and with it Qt6Gui would not be found"
              exit 1
            fi
          done

      - name: Install the CLI's Python dependencies
        run: |
          python -m pip install pyyaml brotli

      - name: Cache the Qt kit
        id: qt-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-example-bundle-${{ env.QT_VERSION }}-${{ hashFiles('.github/workflows/wasm-proofs.yml') }}

      - name: Install aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@${{ env.AQT_VERSION }}"

      - name: Install Qt host kit (desktop)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            -m qtwebsockets qtremoteobjects qthttpserver qtnetworkauth \
            --outputdir "$QT_ROOT"

      - name: Install Qt WebAssembly kit (single-threaded) + WebSockets
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread \
            -m qtwebsockets --outputdir "$QT_ROOT"
          bash .github/scripts/fix-wasm-kit-permissions.sh \
            "$QT_ROOT/$QT_VERSION/wasm_singlethread"

      - name: Install Qt sources for QtRemoteObjects
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m aqt install-src linux "$QT_VERSION" \
            --archives qtremoteobjects --outputdir "$QT_ROOT"

      - name: Cache Emscripten
        id: emsdk-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EM_VERSION }}-${{ hashFiles('.github/workflows/wasm-proofs.yml') }}

      - name: Install and activate Emscripten ${{ env.EM_VERSION }}
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EM_VERSION"
          "$HOME/emsdk/emsdk" activate "$EM_VERSION"

      - name: Build QtRemoteObjects into the WASM kit
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          QT_WASM="$QT_ROOT/$QT_VERSION/wasm_singlethread"
          export QT_HOST_PATH="$QT_ROOT/$QT_VERSION/gcc_64"
          "$QT_WASM/bin/qt-cmake" -S "$QT_ROOT/$QT_VERSION/Src/qtremoteobjects" \
            -B "$RUNNER_TEMP/qtro-wasm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$QT_WASM"
          cmake --build "$RUNNER_TEMP/qtro-wasm"
          cmake --install "$RUNNER_TEMP/qtro-wasm"

      - name: Provide jwt-cpp headers
        shell: bash
        run: |
          set -eu
          git clone --depth 1 --branch "$JWT_CPP_VERSION" https://github.com/Thalhammer/jwt-cpp \
            "$RUNNER_TEMP/jwt-cpp"
          echo "JWT_CPP_INCLUDE_DIR=$RUNNER_TEMP/jwt-cpp/include" >> "$GITHUB_ENV"

      - name: synqt check, then synqt build the arena
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/synqt
          QTDIR: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/gcc_64
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          python -m synqt check --project-dir examples/arena
          python -m synqt build --project-dir examples/arena --release --verbose

      - name: Assert the bundle is real and servable
        run: |
          BUNDLE=examples/arena/build/client
          rc=0
          MANIFEST="$BUNDLE/synqt-manifest.json"
          if [ ! -s "$MANIFEST" ]; then
            echo "  MISSING synqt-manifest.json: nothing says what this bundle is"
            exit 1
          fi
          WASM=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["wasm"])' "$MANIFEST")
          JS="${WASM%.wasm}.js"
          echo "  bundle names its module $WASM"
          for f in "$WASM" "$JS" qtloader.js index.html synqt-boot.js; do
            if [ -s "$BUNDLE/$f" ]; then
              echo "  OK      $f ($(stat -c%s "$BUNDLE/$f") bytes)"
            else
              echo "  MISSING $f"; rc=1
            fi
          done
          for f in "$WASM.gz" "$JS.gz"; do
            if [ -s "$BUNDLE/$f" ]; then echo "  OK      $f"; else echo "  MISSING $f"; rc=1; fi
          done
          # The edge's CSP blocks inline script. An absent file must not read as clean.
          if [ ! -s "$BUNDLE/index.html" ]; then
            echo "  FAIL    index.html absent: nothing to check for inline script"; rc=1
          elif grep -qE '<script[^>]*>[^<]' "$BUNDLE/index.html"; then
            echo "  FAIL    index.html has inline script (the edge CSP blocks it)"; rc=1
          else
            echo "  OK      index.html is free of inline script"
          fi
          exit "$rc"

      - name: Archive the bundle listing
        if: always()
        run: ls -la examples/arena/build/client || true
