# tests/memory/run-leakcheck.sh over the whole tree: a soak pass, then an AddressSanitizer
# pass that fails on a leak record rooted in src/.

name: "[TEST] Look for what the suites leak"

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: leaks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep identical across every workflow. Tools/synqt/tests/test_qt_pin.py fails when one drifts.
  AQT_VERSION: "16db45a70b5905ad596941b223469bc86a56901e"

jobs:
  # Gates the jobs with `if:`, never `paths:`, so required checks still report.
  changes:
    name: Decide what this run has to build
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          bash .github/scripts/relevant-changes.sh \
              "src/" \
              "tests/memory/" \
              ".github/workflows/leaks.yml" \
              ".github/scripts/relevant-changes.sh" >> "$GITHUB_OUTPUT"

  leaks:
    name: leaks (linux)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_VERSION: "6.12.0"
      QT_ROOT: ${{ github.workspace }}/Qt
      QT_MODULES: "qtwebsockets qtremoteobjects qthttpserver qtnetworkauth qttasktree"
      JWT_CPP_VERSION: "v0.7.2"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the CLI's Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install pyyaml

      - name: Install build tools (CMake + Ninja)
        uses: lukka/get-cmake@v4.4.2

      - name: Install the native dependencies Qt needs to configure
        # No keyring daemon: LeakSanitizer would report glib's caches.
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libgl1-mesa-dev \
              libwayland-dev libwayland-bin \
              libhiredis-dev libmongoc-dev libpq-dev libsecret-1-dev

      - name: Provide jwt-cpp headers
        run: |
          set -eu
          git clone --depth 1 --branch "$JWT_CPP_VERSION" \
            https://github.com/Thalhammer/jwt-cpp "$RUNNER_TEMP/jwt-cpp"
          echo "JWT_CPP_INCLUDE_DIR=$RUNNER_TEMP/jwt-cpp/include" >> "$GITHUB_ENV"

      - name: Cache the Qt kit
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-leaks-${{ env.QT_VERSION }}-${{ hashFiles('.github/workflows/leaks.yml') }}

      - name: Install aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@${{ env.AQT_VERSION }}"

      - name: Install the Qt host kit and its add-on modules
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          kit="$QT_ROOT/$QT_VERSION/gcc_64"
          python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir "$QT_ROOT"
          for m in $QT_MODULES; do
            python -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
              -m "$m" --outputdir "$QT_ROOT" \
              || echo "prebuilt $m unavailable; will try a source build"
          done

          pkg_for() {
            case "$1" in
              qtwebsockets)    echo Qt6WebSockets ;;
              qtremoteobjects) echo Qt6RemoteObjects ;;
              qthttpserver)    echo Qt6HttpServer ;;
              qtnetworkauth)   echo Qt6NetworkAuth ;;
              qttasktree)      echo Qt6TaskTree ;;
            esac
          }
          for m in $QT_MODULES; do
            pkg="$(pkg_for "$m")"
            if [ -z "$pkg" ]; then
              echo "::error::QT_MODULES lists '$m' but pkg_for() has no package name for it"
              exit 1
            fi
            if [ -f "$kit/lib/cmake/$pkg/${pkg}Config.cmake" ]; then
              echo "$m present ($pkg)"
              continue
            fi
            echo "$m missing; building it from source into the kit"
            python -m aqt install-src linux "$QT_VERSION" --archives "$m" --outputdir "$QT_ROOT"
            "$kit/bin/qt-cmake" -S "$QT_ROOT/$QT_VERSION/Src/$m" -B "$RUNNER_TEMP/$m-build" \
              -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$kit"
            cmake --build "$RUNNER_TEMP/$m-build"
            cmake --install "$RUNNER_TEMP/$m-build"
          done

      - name: Soak, then sanitize
        env:
          QT_HOST: ${{ env.QT_ROOT }}/${{ env.QT_VERSION }}/gcc_64
        run: bash tests/memory/run-leakcheck.sh

      - name: Keep the sanitizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: leakcheck-logs
          path: build/leakcheck/leaks/
          if-no-files-found: warn
