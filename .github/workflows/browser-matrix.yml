# The M0 browser matrix (Chromium, Firefox, WebKit; ws and wss; reconnect) and the
# split-origin cookie measurement. Builds QtRemoteObjects into the WASM kit.

name: "[TEST] Run the browser matrix (Chromium, Firefox, WebKit)"

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/m0-transport/**"
      - "tests/split-origin/**"
      - ".github/workflows/browser-matrix.yml"

permissions:
  contents: read

concurrency:
  group: browser-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep identical across every workflow. Tools/synqt/tests/test_qt_pin.py fails when one drifts.
  AQT_VERSION: "16db45a70b5905ad596941b223469bc86a56901e"

jobs:
  m0:
    name: M0 transport (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: webkit-linux
            qt_host_arch: linux_gcc_64
            qt_host_dir: gcc_64
          - os: macos-15
            label: webkit-macos
            qt_host_arch: clang_64
            qt_host_dir: macos
    env:
      QT_VERSION: "6.12.0"
      EM_VERSION: "5.0.5"
      QT_ROOT: ${{ github.workspace }}/Qt
      M0_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install build tools (CMake + Ninja)
        uses: lukka/get-cmake@v4.4.2

      - name: Install the native dependencies Qt needs to configure (Linux)
        # OpenGL and Wayland for Qt6Gui's plugin scan; Mesa and GLX/EGL for the browsers' WebGL.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgl1-mesa-dri \
            libglx-mesa0 libegl1 libegl-mesa0 libgbm1 \
            libwayland-dev libwayland-bin
          for w in wayland-client wayland-server wayland-cursor wayland-egl; do
            if ! pkg-config --exists "$w"; then
              echo "::error::$w is missing, so Qt6WaylandClient and with it Qt6Gui would not be found"
              exit 1
            fi
          done

      - name: Cache the Qt kit
        # Covers the from-source QtRemoteObjects too, which installs into the kit prefix.
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ matrix.label }}-${{ env.QT_VERSION }}-${{ hashFiles('.github/workflows/browser-matrix.yml') }}

      - name: Install aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        # A pinned commit, not a release. No released aqt can install the Windows kit
        # (toolchain.AQT_VERSION).
        run: |
          python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@${{ env.AQT_VERSION }}"

      - name: Install Qt host kit (desktop) + WebSockets + RemoteObjects
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m aqt install-qt ${{ runner.os == 'macOS' && 'mac' || 'linux' }} desktop \
            "$QT_VERSION" ${{ matrix.qt_host_arch }} \
            -m qtwebsockets qtremoteobjects \
            --outputdir "$QT_ROOT"

      - name: Install Qt WASM kit (single-threaded) + WebSockets
        if: steps.qt-cache.outputs.cache-hit != 'true'
        # The WASM kit is published under all_os/wasm, not under the host's desktop target.
        run: |
          python -m aqt install-qt all_os wasm \
            "$QT_VERSION" wasm_singlethread \
            -m qtwebsockets \
            --outputdir "$QT_ROOT"
          bash .github/scripts/fix-wasm-kit-permissions.sh \
            "$QT_ROOT/$QT_VERSION/wasm_singlethread"

      - name: Install Qt sources for QtRemoteObjects
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m aqt install-src ${{ runner.os == 'macOS' && 'mac' || 'linux' }} \
            "$QT_VERSION" --archives qtremoteobjects --outputdir "$QT_ROOT"

      - name: Cache Emscripten
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EM_VERSION }}-${{ hashFiles('.github/workflows/browser-matrix.yml') }}

      - name: Install and activate Emscripten ${{ env.EM_VERSION }}
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EM_VERSION"
          "$HOME/emsdk/emsdk" activate "$EM_VERSION"

      - name: Build QtRemoteObjects into the WASM kit
        if: steps.qt-cache.outputs.cache-hit != 'true'
        # The prebuilt WASM kit ships no QtRemoteObjects. Qt-cmake, since the kit's
        # qt-configure-module is broken on Linux.
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          QT_WASM="$QT_ROOT/$QT_VERSION/wasm_singlethread"
          SRC="$QT_ROOT/$QT_VERSION/Src/qtremoteobjects"
          # The all_os/wasm kit carries Qt's own build-machine host path, so name the host tools.
          export QT_HOST_PATH="$QT_ROOT/$QT_VERSION/${{ matrix.qt_host_dir }}"
          "$QT_WASM/bin/qt-cmake" -S "$SRC" -B "$RUNNER_TEMP/qtro-wasm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$QT_WASM"
          cmake --build "$RUNNER_TEMP/qtro-wasm"
          cmake --install "$RUNNER_TEMP/qtro-wasm"

      - name: Install Playwright engines (WebKit + Chromium + Firefox)
        working-directory: tests/m0-transport/verify
        run: |
          npm install --no-audit --no-fund
          if [ "${{ runner.os }}" = "Linux" ]; then
            npx --yes playwright install-deps webkit chromium firefox
          fi
          npx --yes playwright install webkit chromium firefox

      - name: Run the M0 browser matrix (Chromium + Firefox + WebKit, ws + wss, reconnect)
        env:
          QT_HOST: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_host_dir }}
          QT_WASM: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/wasm_singlethread
          QT_HOST_PATH: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_host_dir }}
          # No GPU on a runner; Mesa's software rasteriser gives the browsers their WebGL context.
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          tests/m0-transport/verify/run-m0.sh

      # WebKit cannot be told to map hosts, so the hosts file does.
      - name: Map the split-origin test sites
        shell: bash
        run: tests/local-network/local-network.sh hosts

      - name: Measure what a split-origin session cookie survives
        shell: bash
        run: tests/split-origin/run-split-origin.sh

      - name: Archive the headless run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m0-${{ matrix.label }}-log
          path: build/m0-verify.log
          if-no-files-found: ignore

      - name: Archive the split-origin measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: split-origin-${{ matrix.label }}-report
          path: build/split-origin-report.json
          if-no-files-found: ignore
