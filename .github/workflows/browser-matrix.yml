# Close the WebKit / Safari column of the M0 browser matrix on hosts the primary dev machine
# (Arch Linux) cannot run: Playwright's WebKit needs Debian/Ubuntu system libraries, and real
# Safari needs macOS. This workflow provisions the pinned toolchain (Qt 6.12.0 + Emscripten
# 5.0.5, with QtRemoteObjects built from source into the WASM kit; the prebuilt kit does not
# ship it, see tests/m0-transport/README.md finding 1), then runs the M0 verifier, which drives
# Chromium + Firefox + WebKit through all four QtRO-over-WebSockets directions and reconnect.
#
#   * ubuntu  -> Playwright WebKit (Safari's engine) with its Linux deps installed;
#   * macOS   -> Playwright WebKit on macOS, the closest automatable stand-in for Safari.app
#     (real Safari.app would need safaridriver + `safaridriver --enable`; that is a follow-up).
#
# It runs on dispatch and when the M0 spike or this file changes. There is no schedule: a
# run provisions the WASM toolchain and builds a Qt module from source, so it is started
# when somebody wants the answer rather than on a clock.
#
# What moves under this workflow is the browser, not the spike: the verifier floats Playwright
# on ^1.49, so each run resolves whatever engine build is current that day. The engine columns
# of "runs in current Chrome, Firefox, and Safari" are therefore only as fresh as the last
# dispatch, which is why the run records the engine versions it drove (see verify.mjs). A green
# run that cannot say what it ran proves less than it looks like, and a green run from six
# months ago says nothing about today's WebKit. Dispatch it before making the claim.
#
# NOTE: this workflow is authored to run on GitHub's runners and cannot be validated on the Arch
# dev box; the aqtinstall arch/module names and the per-OS Qt install directory are the most
# likely first-run adjustments.

name: "[TEST] Run the browser matrix (Chromium, Firefox, WebKit)"

on:
  workflow_dispatch:
  push:
    paths:
      # Exactly what a run compiles. The M0 spike is self-contained (its own edge and client,
      # its own QIODevice adapter), so it does not build src/transport or src/client and those
      # paths do not appear here: a workflow that runs on a change it cannot
      # exercise reads as coverage without being any.
      - "tests/m0-transport/**"
      # The split-origin rig runs here for one reason: this is the only workflow with a
      # WebKit runtime, and WebKit is the engine its documented table cannot fill in
      # locally. It compiles nothing, so it is cheap to carry alongside the M0 build.
      - "tests/split-origin/**"
      - ".github/workflows/browser-matrix.yml"

# Nothing here writes to the repository: every job checks the tree out, builds it, and
# uploads its artifacts, which needs no token at all. Stating that here means the run keeps
# a read-only token whatever the repository or organisation default happens to be.
permissions:
  contents: read

concurrency:
  group: browser-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  # aqtinstall, pinned to a commit and not to a release: no released aqt can install the
  # Windows kit, because Qt publishes the Windows desktop repository one folder per toolchain
  # and aqt only learned to look there after the last release. tools/synqt/synqt/toolchain.py
  # carries the full note. Keep this identical in ctest.yml, browser-matrix.yml,
  # wasm-proofs.yml, benchmarks.yml and leaks.yml; tools/synqt/tests/test_qt_pin.py fails when
  # one of them drifts.
  AQT_VERSION: "16db45a70b5905ad596941b223469bc86a56901e"

jobs:
  m0:
    name: M0 transport (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: webkit-linux
            qt_host_arch: linux_gcc_64
            qt_host_dir: gcc_64
          - os: macos-15
            label: webkit-macos
            qt_host_arch: clang_64
            qt_host_dir: macos
    env:
      QT_VERSION: "6.12.0"
      EM_VERSION: "5.0.5"
      QT_ROOT: ${{ github.workspace }}/Qt
      M0_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install build tools (CMake + Ninja)
        uses: lukka/get-cmake@v4.4.2

      - name: Install the native dependencies Qt needs to configure (Linux)
        # Qt6GuiConfig hard-requires WrapOpenGL, so without the OpenGL dev files Qt6Gui sets
        # Qt6Gui_FOUND to FALSE and find_package(Qt6) fails with "Failed to find required Qt
        # component Gui" while pointing at a Qt6GuiConfig.cmake that plainly exists, which is
        # what makes this one slow to read: the file it names is not the file that is missing.
        # libgl1-mesa-dev pulls the libglvnd dev files, covering CMake's OPENGL_opengl_LIBRARY,
        # OPENGL_glx_LIBRARY, and OPENGL_INCLUDE_DIR. macOS has OpenGL in the SDK and needs
        # none of this, which is why only the Linux column ever failed here.
        #
        # The rasteriser and the GLX and EGL runtimes are for the browsers rather than for
        # the build. The M0 client is an ApplicationWindow, so it needs a WebGL context to
        # start its scene graph, and only Chromium brings a rasteriser of its own; Firefox
        # and WebKit take the machine's GL and get nothing on a runner where Mesa is absent.
        # A WASM client that cannot create the context does not just fail to draw: Qt ends
        # it with qFatal, which is emscripten's abort(), which sets ABORT, after which every
        # callback queued through emscripten_async_call is dropped, which is the first hop of
        # QEventDispatcherWasm::wakeUp(). The socket, the timers and the property pushes
        # carry on and posted events never arrive again, which is the shape of the Firefox
        # stall this matrix has been carrying (tests/m0-transport/FIREFOX-LINUX.md).
        #
        # Wayland: the 6.12.0 desktop kit ships the QtWayland platform plugins, and Qt6Gui's
        # plugin scanning find_dependency's Qt6WaylandClient, which wants the wayland-client,
        # wayland-server, wayland-cursor and wayland-egl pkg-config modules. The M0 edge asks
        # for Gui, so without them its configure fails the same way as without OpenGL. The
        # same packages and the same check as .github/actions/qt-kit, which this job does
        # not use.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgl1-mesa-dri \
            libglx-mesa0 libegl1 libegl-mesa0 libgbm1 \
            libwayland-dev libwayland-bin
          for w in wayland-client wayland-server wayland-cursor wayland-egl; do
            if ! pkg-config --exists "$w"; then
              echo "::error::$w is missing, so Qt6WaylandClient and with it Qt6Gui would not be found"
              exit 1
            fi
          done

      - name: Cache the Qt kit
        # The whole kit tree, kits plus the QtRemoteObjects we build from source into the WASM
        # kit below: that build installs into the kit prefix, so one cache of QT_ROOT covers both
        # the download and the from-source build, and every Qt install/build step is skipped on a
        # hit. Keyed on the workflow file so a change to the pinned Qt/aqt/emsdk versions (all env
        # here) or the install steps invalidates it. Same pattern as ctest.yml.
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ matrix.label }}-${{ env.QT_VERSION }}-${{ hashFiles('.github/workflows/browser-matrix.yml') }}

      - name: Install aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        # A pinned commit rather than a release, because aqt's last release cannot install the
        # Windows kit: Qt publishes the Windows desktop repository one folder per toolchain
        # (windows_x86/desktop/qt6_6120/qt6_6120_msvc2022_64/), and the support for addressing
        # it landed after 3.3.0 shipped. Linux and macOS still get the flat folder, which is
        # why this was invisible everywhere but the Windows column.
        #
        # Never a branch or a tag that moves: this job holds a token and produces artifacts
        # the rest of the pipeline trusts, so what provisions it is one reviewed tree. Moving
        # it is a reviewed edit, in every workflow at once, and tools/synqt/synqt/toolchain.py
        # is where the reasoning lives.
        run: |
          python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@${{ env.AQT_VERSION }}"

      - name: Install Qt host kit (desktop) + WebSockets + RemoteObjects
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m aqt install-qt ${{ runner.os == 'macOS' && 'mac' || 'linux' }} desktop \
            "$QT_VERSION" ${{ matrix.qt_host_arch }} \
            -m qtwebsockets qtremoteobjects \
            --outputdir "$QT_ROOT"

      - name: Install Qt WASM kit (single-threaded) + WebSockets
        if: steps.qt-cache.outputs.cache-hit != 'true'
        # all_os/wasm, not <host>/desktop: the WASM kit is one host-independent build published
        # under its own host and target, and asking for it under the desktop target fails with
        # "Failed to locate XML data for Qt version", which reads like the version is gone
        # rather than like the coordinates are wrong.
        run: |
          python -m aqt install-qt all_os wasm \
            "$QT_VERSION" wasm_singlethread \
            -m qtwebsockets \
            --outputdir "$QT_ROOT"
          bash .github/scripts/fix-wasm-kit-permissions.sh \
            "$QT_ROOT/$QT_VERSION/wasm_singlethread"

      - name: Install Qt sources for QtRemoteObjects
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m aqt install-src ${{ runner.os == 'macOS' && 'mac' || 'linux' }} \
            "$QT_VERSION" --archives qtremoteobjects --outputdir "$QT_ROOT"

      - name: Cache Emscripten
        # emsdk is downloaded and pinned to EM_VERSION on every run otherwise; the SDK version is
        # fixed, so cache the whole tree and re-source emsdk_env.sh on a hit. Independent of the
        # Qt cache: a later WASM compile needs emsdk present even when the kit was restored.
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EM_VERSION }}-${{ hashFiles('.github/workflows/browser-matrix.yml') }}

      - name: Install and activate Emscripten ${{ env.EM_VERSION }}
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EM_VERSION"
          "$HOME/emsdk/emsdk" activate "$EM_VERSION"

      - name: Build QtRemoteObjects into the WASM kit
        if: steps.qt-cache.outputs.cache-hit != 'true'
        # The prebuilt WASM kit ships QtWebSockets but not QtRemoteObjects; build it from the
        # pinned source with the kit's qt-cmake (its qt-configure-module is broken on Linux) and
        # install it into the kit prefix so the M0 client can link it.
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          QT_WASM="$QT_ROOT/$QT_VERSION/wasm_singlethread"
          SRC="$QT_ROOT/$QT_VERSION/Src/qtremoteobjects"
          # QT_HOST_PATH: a cross-compiled Qt must be told where its host tools are. The kit
          # carries Qt's own build-machine path (/home/qt/work/install), and only a
          # host-specific aqt install rewrites it, which the host-independent all_os/wasm kit
          # is not, so it has to be named here.
          export QT_HOST_PATH="$QT_ROOT/$QT_VERSION/${{ matrix.qt_host_dir }}"
          "$QT_WASM/bin/qt-cmake" -S "$SRC" -B "$RUNNER_TEMP/qtro-wasm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$QT_WASM"
          cmake --build "$RUNNER_TEMP/qtro-wasm"
          cmake --install "$RUNNER_TEMP/qtro-wasm"

      - name: Install Playwright engines (WebKit + Chromium + Firefox)
        working-directory: tests/m0-transport/verify
        run: |
          npm install --no-audit --no-fund
          if [ "${{ runner.os }}" = "Linux" ]; then
            npx --yes playwright install-deps webkit chromium firefox
          fi
          npx --yes playwright install webkit chromium firefox

      - name: Run the M0 browser matrix (Chromium + Firefox + WebKit, ws + wss, reconnect)
        env:
          QT_HOST: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_host_dir }}
          QT_WASM: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/wasm_singlethread
          # run-m0.sh configures the client through the wasm kit's qt-cmake, which needs the
          # host tools named (see the QtRemoteObjects build step).
          QT_HOST_PATH: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_host_dir }}
          # No GPU here, so say so rather than letting each engine find out for itself.
          # Measured on a workstation forced to llvmpipe this way: headless Firefox hands out
          # a WebGL 2.0 context with no preferences set, so Mesa's software rasteriser is
          # all the browsers ever needed. Harmless on macOS, which ignores it.
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          tests/m0-transport/verify/run-m0.sh

      # The two test sites must be real, separate registrable domains or no third-party
      # cookie rule applies and the measurement is void. Chromium and Firefox can be told to
      # map them; WebKit cannot, and WebKit is Safari's engine, which is the one browser
      # whose cookie policy split-origin cannot afford to guess at. So map them for real
      # here, which is the only place this project has a WebKit runtime.
      - name: Map the split-origin test sites
        shell: bash
        run: tests/local-network/local-network.sh hosts

      - name: Measure what a split-origin session cookie survives
        shell: bash
        run: tests/split-origin/run-split-origin.sh

      - name: Archive the headless run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m0-${{ matrix.label }}-log
          path: build/m0-verify.log
          if-no-files-found: ignore

      # The gate asserts the three findings that have a local baseline; it asserts nothing
      # about WebKit, because there is no baseline to assert yet. Passing is therefore not
      # the WebKit result, this file is, and the split-origin table in
      # docs/project-layout-and-config.md stays marked inference until someone reads it.
      - name: Archive the split-origin measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: split-origin-${{ matrix.label }}-report
          path: build/split-origin-report.json
          if-no-files-found: ignore
