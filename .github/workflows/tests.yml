# The checks that need no Qt.

name: "[TEST] Run the Python test suites"

on:
  push:
    # authors.yml's branch; its pull request is still tested.
    paths-ignore:
      - "AUTHORS"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the CLI, contract generator, and docs lexers (editable) plus test deps
        # brotli. The bundle-precompress test asserts the .br copy.
        run: python -m pip install --upgrade pip && python -m pip install -e ./tools/synqt -e ./tools/synqtc -e ./tools/pygments-synqt pytest brotli

      - name: Confirm openssl is available (the mesh-CA tests use it)
        run: openssl version

      - name: Run the test suites
        run: >
          python -m pytest tools/synqt/tests tools/synqtc/tests tools/pygments-synqt/tests
          benchmarks/tests -q

  coverage:
    name: CLI coverage floor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the CLI (editable) plus test deps
        run: >
          python -m pip install --upgrade pip &&
          python -m pip install -e ./tools/synqt pytest brotli coverage

      - name: Confirm openssl is available (the mesh-CA tests use it)
        run: openssl version

      - name: Measure and enforce the floor
        run: HALVES=py tests/run-coverage.sh

  node-checks:
    name: node checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"

      # The same floating major the docs theme loads at runtime.
      - name: Install mermaid (the version the docs site loads) and a DOM for it
        run: npm install --no-save mermaid@11 jsdom

      - name: Parse every diagram in docs/
        run: node tools/check-mermaid/check-mermaid.mjs docs

      - name: Check the editor's rules against the shared topologies
        run: node tools/check-designrules/check-designrules.mjs

  designer:
    name: design editor (browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"

      - name: Install the CLI and the contract generator (editable)
        run: >
          python -m pip install --upgrade pip &&
          python -m pip install -e ./tools/synqt -e ./tools/synqtc

      - name: Install Playwright and Chromium
        working-directory: tests/designer
        run: npm install && npx playwright install --with-deps chromium

      - name: Drive the editor, and the copy the site publishes
        working-directory: tests/designer
        env:
          DESIGNER_HEADLESS: "1"
        run: node verify.mjs
