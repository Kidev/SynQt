# Regenerate AUTHORS after a merge and open a pull request when it differs from main.
# Nothing from the pull request head is checked out or executed.

name: "[CONTRIB] Update AUTHORS when a pull request lands"

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authors
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate AUTHORS
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Mint a token for the SynQt-Operations app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SYNQT_CLIENT_ID }}
          private-key: ${{ secrets.SYNQT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Regenerate AUTHORS
        run: bash .github/scripts/update-authors.sh

      - name: Open a pull request if it changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: authors/update
        run: |
          set -euo pipefail

          if git diff --quiet -- AUTHORS; then
            echo "AUTHORS is already current; nothing to open."
            exit 0
          fi

          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"
          git add AUTHORS
          git commit -m "Update AUTHORS"

          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"

          open="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "${open}" ]; then
            echo "Pull request #${open} already open; it now carries the update."
            exit 0
          fi

          gh pr create --base main --head "${BRANCH}" \
            --title "Update AUTHORS" \
            --body "AUTHORS is generated from the commit history by .github/scripts/update-authors.sh. It went out of date when the last pull request merged. This is the regenerated file and nothing else."
