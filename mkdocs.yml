#
# SynQt documentation site (MkDocs + Material).
# Build locally: pip install -r requirements.txt && mkdocs serve
# Deploy:         pushed to main, built and published by .github/workflows/docs.yml

site_name: SynQt
site_description: Build complete web systems in Qt and QML, with no third party servers to stand up.
site_url: https://synqt.org/
site_author: Kidev
repo_url: https://github.com/Kidev/SynQt
repo_name: Kidev/SynQt
edit_uri: edit/main/docs/
# The entity, not a literal (c): Material inserts this line into the footer as HTML,
# and the file itself stays ASCII like the rest of the repository. Quoted, because a
# bare `&` opens a YAML anchor.
copyright: "&copy; 2026 SynQt - kidev"

theme:
  name: material
  language: en
  logo: assets/synqt.svg
  favicon: assets/synqt.ico
  # overrides/partials/nav.html: drops the unclickable "SynQt" text label from the
  # top of the left nav drawer (Material's stock partial puts the site name there
  # as plain text next to the logo link, not as a link itself).
  # overrides/partials/footer.html: labels the previous and next links with the
  # section title when the page they point at is called "Overview", so the last
  # page of a tutorial offers the next tutorial by name.
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  # Single scheme, no toggle: SynQt's docs are dark themed only (see extra.css
  # for the actual brand hex values; primary/accent here just need to be valid
  # Material color names, since --md-primary-fg-color and --md-accent-fg-color
  # are overridden unconditionally right after). Not "black": Material special
  # cases that one with a hardcoded `[data-md-color-primary=black] .md-header`
  # background rule that bypasses --md-primary-fg-color entirely, so the
  # override below would have no visible effect on the header.
  palette:
    - scheme: slate
      primary: indigo
      accent: light-blue

extra_css:
  - stylesheets/extra.css
  # The scrollbar the page draws for itself. Its own file because the C++ reference in
  # the frame on /api/ loads the same one (see the Doxyfile), so the bar there and the
  # bar here are one thing rather than two that have to be kept looking alike.
  - stylesheets/scrollbar.css
  - stylesheets/home.css
  - stylesheets/download-modal.css
  - stylesheets/api-shell.css

# The "Download" nav entry below points at https://get.synqt.org/. That URL now
# serves the installer script itself (for `curl | sh`), so the user-facing
# download page it used to serve lives here: download-modal.js intercepts the
# nav link and opens a modal instead, falling back to the plain link with JS off.
extra_javascript:
  - javascripts/download-modal.js
  # Keeps the address bar, the browser tab and the frame on /api/ in step; see
  # docs/api.md and overrides/api.html.
  - javascripts/api-shell.js
  # Redraws the header's repository facts from the last ones this browser received
  # when the GitHub API refuses a fetch (its hourly allowance is sixty requests).
  - javascripts/source-facts.js
  # The home page's "What it looks like" project: the tree and diagram triggers, the
  # code glossary, and the explanation under the file being read.
  - javascripts/home-flow.js
  # Draws the scrollbar from under the header down, where the platform draws one that
  # takes space. The document keeps scrolling; only the bar is ours. The C++ reference
  # runs this same file inside the frame on /api/ (see the Doxyfile), where it draws the
  # same bar for the pane that scrolls there.
  - javascripts/scrollbar.js

extra:
  generator: false
  # The home page's <title> (overrides/main.html). Kept short enough to survive a browser
  # tab and a search result, where the bare site name says nothing about what SynQt is.
  tagline: Build complete web systems using QML

# Generates the Doxygen C++ reference into the built site under /api/ref/, which the
# shell page at /api/ (docs/api.md) shows in a frame, and rewrites its navigation (see
# docs/api-reference.md). Skipped with a warning when doxygen is not installed.
hooks:
  - tools/docs-hooks/doxygen.py
  # Appends a content hash to the extra_css and extra_javascript references above, so a
  # deploy can never pair this page's new script with a reader's cached stylesheet.
  - tools/docs-hooks/assets.py
  # Publishes the design editor at /designer/, copied from the directory `synqt design`
  # serves out of the installed package, so the page docs/designer.md describes is the
  # one the command opens. It refuses to publish an asset that names another host: this
  # copy is static, so no header goes over it to refuse the fetch at run time.
  - tools/docs-hooks/designer.py

# What `mkdocs serve` rebuilds on. It watches this file and docs/ by itself, and nothing
# else: everything the site is also built from has to be named here or an edit to it is
# invisible until the server is restarted, which is a slow way to find out that the page
# in front of you is stale. That is the page templates, and the whole of what the C++
# reference under /api/ is made of: the headers it documents, the Doxyfile, and the
# stylesheets, templates and hook that shape the result.
watch:
  - overrides
  - src
  - Doxyfile
  - tools/docs-hooks
  # The design editor itself, which the hook above copies to /designer/.
  - tools/synqt/synqt/assets/design

plugins:
  - search
  # Converts GitHub style alerts (> [!NOTE], > [!TIP], ...) into Material
  # admonitions at build time, so the source markdown stays unchanged and keeps
  # rendering on GitHub too. aliases:false keeps IMPORTANT and CAUTION as their own
  # types (styled in stylesheets/extra.css) instead of folding them into tip/warning.
  - callouts:
      aliases: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      # Route ```qml code blocks through the SynQt QML lexer (tools/pygments-synqt),
      # so a Contract.onSignal: attached handler colors the same way as the hand
      # authored home page tooltip. The built-in `qml` alias would otherwise win.
      extend_pygments_lang:
        - name: qml
          lang: synqt-qml
  - pymdownx.superfences:
      custom_fences:
        # Renders ```mermaid fenced blocks as diagrams.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

# A link inside the docs that points at nothing is a broken page, so it fails the build
# rather than scrolling past as an INFO line (which is what happened when a heading was
# renamed and five links to its anchor went stale unnoticed). Only in-repo links are
# raised: an absolute or external URL is nobody's to validate here. `mkdocs build
# --strict` is what turns these warnings into a non-zero exit.
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Quick start: quick-start.md
  - Tutorials:
      - Getting started: getting-started.md
      - The auction:
          - Overview: tutorial.md
          - The base case: tutorial-base-auction.md
          - Real bidders: tutorial-sign-in.md
          - A permanent Hall of Fame: tutorial-hall-of-fame.md
          - Where to go next: tutorial-next-steps.md
      - The multiplayer game:
          - Overview: tutorial-multiplayer.md
          - The arena the edge owns: tutorial-multiplayer-world.md
          - See the others: tutorial-multiplayer-client.md
          - The round and the Hall of Fame: tutorial-multiplayer-rounds.md
          - Only what you can see: tutorial-multiplayer-run.md
      - The light storefront:
          - Overview: tutorial-remote-pages.md
          - Build it: tutorial-remote-pages-build.md
          - Lighter and live: tutorial-remote-pages-live.md
          - Links that work: tutorial-remote-pages-urls.md
      - Shipping it:
          - Overview: tutorial-ship.md
          - The pipeline that says no: tutorial-ship-pipeline.md
          - Two authorities: tutorial-ship-certificates.md
          - Where the binaries go: tutorial-ship-hosts.md
          - Cutting a release: tutorial-ship-release.md
      - Advanced:
          - Overview: tutorial-advanced.md
          - A database of your own: tutorial-advanced-database.md
          - A cache of your own: tutorial-advanced-cache.md
          - An identity service of your own: tutorial-advanced-identity.md
  - Framework:
      - Architecture: architecture.md
      - Programming model: programming-model.md
      - Routes and URLs: routing.md
      - Remote pages: remote-pages.md
      - Entities: entities.md
      - Providers: providers.md
      - Authentication: authentication.md
      - Runtime API reference: runtime-api.md
      - Project layout and config: project-layout-and-config.md
      - Build system and CLI: build-system-and-cli.md
      - Testing your app: testing.md
      - Running in containers: docker.md
      - Deploying: deploying.md
      - Desktop clients: desktop.md
      - Security: security.md
      - Content-Security-Policy: csp.md
      - Examples: examples.md
      - Licensing: licensing.md
      - Contributing:
          - Developer guide: development.md
          - C++ API reference: api-reference.md
          - Browser coverage: browser-proofs.md
  # Straight into the generated Doxygen reference, so it is one click from every page
  # rather than one click behind the page that introduces it. A real page of this site
  # (docs/api.md), not an absolute link out of it: the reference is shown in a frame on
  # that page, so this tab behaves like every other one, keeps its active state, and does
  # not reload the header on the way in.
  - C++ reference: api.md
  # The design editor itself, published at this URL by tools/docs-hooks/designer.py rather
  # than written as a page. It must stay a URL nothing here builds to: the hook refuses a
  # site where a page claims it, because a page there would be overwritten and its entry in
  # sitemap.xml would make instant navigation swap the editor into this shell.
  - Draw your app: /designer/
  - Download: https://get.synqt.org/

# The guide to the editor. Not in the nav because the tab above goes to the editor itself,
# which is what somebody looking for it wants; the guide is linked from the quick start,
# from Getting started, and from the editor's own page.
not_in_nav: |
  visual-editor.md
