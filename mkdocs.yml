          - The base case: tutorial-base-auction.md
          - Real bidders: tutorial-sign-in.md
          - A permanent Hall of Fame: tutorial-hall-of-fame.md
          - Where to go next: tutorial-next-steps.md
      - The multiplayer game:
          - Overview: tutorial-multiplayer.md
          - The arena the edge owns: tutorial-multiplayer-world.md
          - See the others: tutorial-multiplayer-client.md
          - The round and the Hall of Fame: tutorial-multiplayer-rounds.md
          - Only what you can see: tutorial-multiplayer-run.md
      - The light storefront:
          - Overview: tutorial-remote-pages.md
          - Build it: tutorial-remote-pages-build.md
          - Lighter and live: tutorial-remote-pages-live.md
          - Links that work: tutorial-remote-pages-urls.md
      - Shipping it:
          - Overview: tutorial-ship.md
          - The pipeline that says no: tutorial-ship-pipeline.md
          - Two authorities: tutorial-ship-certificates.md
          - Where the binaries go: tutorial-ship-hosts.md
          - Cutting a release: tutorial-ship-release.md
      - Advanced:
          - Overview: tutorial-advanced.md
          - A database of your own: tutorial-advanced-database.md
          - A cache of your own: tutorial-advanced-cache.md
          - An identity service of your own: tutorial-advanced-identity.md
  - Framework:
      - Architecture: architecture.md
      - Programming model: programming-model.md
      - Entities: entities.md
      - Providers: providers.md
      - Building an app:
          - Routes and URLs: routing.md
          - Remote pages: remote-pages.md
          - Authentication: authentication.md
          - Desktop clients: desktop.md
          - Testing your app: testing.md
      - Reference:
          - Runtime API: runtime-api.md
          - Project layout and config: project-layout-and-config.md
          - Build system and CLI: build-system-and-cli.md
      - Security:
          - Overview: security.md
          - Content-Security-Policy: csp.md
          - Privacy and the GDPR: privacy.md
      - Running it:
          - Running in containers: docker.md
          - Deploying: deploying.md
          - Monitoring: monitoring.md
      - Contributing:
          - Developer guide: development.md
          - C++ API reference: api-reference.md
          - Browser coverage: browser-proofs.md
      - Examples: examples.md
      - Licensing: licensing.md
  - C++ reference: api.md
  # Published by tools/docs-hooks/designer.py. The hook refuses a site where a page claims it.
  - Designer: /designer/
  - Download: https://get.synqt.org/

# The editor's guide. Linked from the quick start, Getting started and the editor itself.
not_in_nav: |
  visual-editor.md
