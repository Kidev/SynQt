#
# SynQt documentation site (MkDocs + Material).
# Build locally. Pip install -r requirements.txt && mkdocs serve
# Deploy:         pushed to main, built and published by .github/workflows/docs.yml

site_name: SynQt
site_description: Build complete web systems in Qt and QML, with no third party servers to stand up.
site_url: https://synqt.org/
site_author: Kidev
repo_url: https://github.com/Kidev/SynQt
repo_name: Kidev/SynQt
edit_uri: edit/main/docs/
copyright: "&copy; 2026 SynQt - kidev"

theme:
  name: material
  language: en
  logo: assets/synqt.svg
  favicon: assets/synqt.ico
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  # Dark only. The brand colours are in extra.css. Not "black": Material hardcodes that
  # header background past --md-primary-fg-color.
  palette:
    - scheme: slate
      primary: indigo
      accent: light-blue

extra_css:
  - stylesheets/extra.css
  # Also loaded by the C++ reference in the frame on /api/ (see the Doxyfile).
  - stylesheets/scrollbar.css
  - stylesheets/home.css
  - stylesheets/download-modal.css
  - stylesheets/api-shell.css

extra_javascript:
  # Opens the Download nav entry as a modal. Https://get.synqt.org/ serves the installer script.
  - javascripts/download-modal.js
  - javascripts/api-shell.js
  - javascripts/source-facts.js
  - javascripts/home-flow.js
  # Also run by the C++ reference in the frame on /api/ (see the Doxyfile).
  - javascripts/scrollbar.js

extra:
  generator: false
  # The home page's <title> (overrides/main.html).
  tagline: Build complete web systems using QML

hooks:
  # The Doxygen C++ reference under /api/ref/, shown in a frame by docs/api.md.
  - tools/docs-hooks/doxygen.py
  # Content hashes on the extra_css and extra_javascript references.
  - tools/docs-hooks/assets.py
  # The design editor at /designer/, copied from what `synqt design` serves.
  - tools/docs-hooks/designer.py

# Everything the site is built from besides this file and docs/.
watch:
  - overrides
  - src
  - Doxyfile
  - tools/docs-hooks
  - tools/synqt/synqt/assets/design

plugins:
  - search
  # GitHub style alerts as Material admonitions. Aliases:false keeps IMPORTANT and CAUTION
  # as their own types (styled in stylesheets/extra.css).
  - callouts:
      aliases: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      # The SynQt lexers from tools/pygments-synqt, over the built-in aliases.
      extend_pygments_lang:
        - name: qml
          lang: synqt-qml
        - name: yaml
          lang: synqt-yaml
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

# `mkdocs build --strict` turns these warnings into a failed build.
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Tutorials:
      - Quick start: quick-start.md
      - Getting started: getting-started.md
      - The simple chat: tutorial-chat.md
      - The auction:
