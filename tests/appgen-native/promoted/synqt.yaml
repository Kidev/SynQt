# The smallest project that promotes identity out of the web edge: one client, one edge, and
# an auth entity named by `identity.provider_entity`. That one line is the whole feature, so
# this fixture declares exactly it and nothing else, and everything else the promotion needs
# has to be generated. The two mesh connect points (identity and sessions), the auth entity's
# Source QML for each, an auth main that builds the OAuth engine and the authoritative session
# store, and an edge main that adopts both Replicas in C++.
#
# What a green build proves that a string test cannot. The auth main compiles against the
# framework contracts in the runtime library (the app carries no Identity.syn), and the
# edge main's adoption block resolves IdentityProvider and SessionManager, which webedge.h
# only forward-declares.
project:
  name: promoted
  version: 0.1.0
  qt_version: 6.11.1

scopes:
  order: [anonymous, user, moderator]
  hierarchical: true
  default: anonymous

entities:
  - name: app
    type: client
    targets: [wasm]

  - name: edge
    type: web_edge
    identity: true
    public:
      port: 8443
    tls:
      cert_file: deploy/edge.crt
      key_file: deploy/edge.key

  # The auth entity. It declares no connect points. It owns the two `provider_entity` implies.
  - name: auth
    type: service

connect_points:
  # One ordinary browser-facing point, so the edge is a real edge rather than a login-only
  # process, and so the generated CMake still resolves a contract the app owns.
  - owner: edge
    consumers: [app]
    # One ordinary browser-facing point, so this fixture's edge is a real edge and its
    # generated CMake still resolves an app contract. What is under test is elsewhere.
    export: |
      prop string[120] message

identity:
  provider_entity: auth
  required: false
  mapping: web/edge/identity/map.qml
  # Both refresh keys, on the entity that holds the tokens. The auth entity, not the edge.
  refresh:
    interval_seconds: 30
    margin_seconds: 300
  session:
    ttl_minutes: 120
  providers:
    - name: github
      client_id: "Iv1.0123456789abcdef"
      client_secret: env:GITHUB_CLIENT_SECRET
  # The development sign-in, beside the real provider rather than instead of it. Here
  # because the promotion is the arrangement it has the most to prove itself against: the
  # server runs in the edge and the entity that dials it is a different process, so a green
  # run says the generated edge starts it under --dev and the generated auth entity reaches
  # it over loopback with the endpoints the framework wrote.
  dev_stub:
    users:
      - { sub: dev, login: dev, name: Developer, email: dev@localhost }
      - { sub: mod, login: mod, name: Moderator, email: moderator@localhost }
