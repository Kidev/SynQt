# The smallest project with an entity that talks to the outside world: one client, one edge,
# and a gateway whose `network:` block opens both halves. `outbound` is the list of URL
# prefixes it may call. `inbound` is the port it serves, the keys that admit a caller, and
# the limits. Everything else about the gateway is its own QML.
#
# What a green build proves that a string test cannot. The generated main compiles against
# SynQtGateway, builds an ApiConfig from this block, puts `Api` on the root context before
# the entity singleton is created, and starts listening after. And what running it proves:
# the routes that singleton declared are the ones being served, behind the key check.
project:
  name: gateway
  version: 0.1.0
  qt_version: 6.11.1

scopes:
  order: [anonymous, user]
  hierarchical: true
  default: anonymous

entities:
  - name: app
    type: client
    targets: [wasm]

  - name: edge
    type: web_edge
    public:
      port: 8443
    tls:
      cert_file: deploy/edge.crt
      key_file: deploy/edge.key

  - name: gw
    type: api
    network:
      # Where it may call. Anything else is refused by Http before a request is sent.
      outbound:
        - https://api.example.com/v1/
      # Who may call it. The keys come from the entity's own environment, never from here.
      inbound:
        port: 18456
        bind: 127.0.0.1
        api_keys: env:GW_API_KEYS
        max_body_bytes: 4096
        rate_per_minute: 600
        # The loopback address the test's own requests arrive from, so the generated main
        # carries the emitted list and the surface reads the forwarded address.
        trusted_proxies: [127.0.0.1]
        tls_terminated_upstream: true # plaintext on loopback, on purpose, for the test

connect_points:
  # TWO consumers of one point, and that is the point. This shape used to refuse to
  # configure at all: repc names its output after the contract and writes it into the
  # DIRECTORY's binary dir, so both consumer targets generated the same files and CMake
  # stopped with "Files to be generated by multiple different commands". It is ordinary the
  # moment two entities read one thing, and until this fixture nothing in the tree had two
  # consumers anywhere, so nothing had ever built it.
  - owner: edge
    consumers: [app, gw]
    export: |
      prop string[120] message
