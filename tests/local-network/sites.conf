#
# The test network: one line per site, "<name> <address> <role>".
#
# These names exist so a browser sees two separate registrable domains. Same-site,
# SameSite, cookie partitioning, CORS and CSP are all computed from scheme and
# registrable domain and never from where the packets went, so a browser cannot tell
# synqtedge.test on loopback from the same name in another country. That is what makes a
# local network a real measurement of those rules rather than an approximation of one. It
# stops being one the moment the question is latency, a proxy, or real TLS termination.
#
# `.test` is reserved by RFC 6761 for exactly this: it can never be delegated, so no
# resolver will ever answer for it and no entry here can shadow a real site.
#
# Addresses: both sites answer on 127.0.0.1 today, because every server that serves them
# binds one socket. Distinct loopback addresses (127.0.0.2, 127.0.0.3, ...) buy two things
# when they are needed -- real port 443 per origin, so no :8443 in a URL, and an edge that
# sees its clients as separate addresses, which is what makes its per-IP connection caps
# behave the way they will in production. Changing the address here is half the job: the
# server has to bind the new address too, and on macOS the alias has to exist first
# (`local-network.sh aliases`, a no-op on Linux, where all of 127/8 is already local).

synqtcdn.test    127.0.0.1  delivers the client bundle
synqtedge.test   127.0.0.1  runs the edge
