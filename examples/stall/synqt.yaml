# The stall storefront. A browser client, a web edge that owns the live catalog and
# delivers marketing campaign pages on demand, and a database that holds the durable
# stock the browser reaches only through the edge. The product grid and cart are compiled
# into the client. The campaign pages are edge-delivered, so a merchandiser changes a
# campaign without a client rebuild.
project:
  name: stall
  version: 0.1.0
  qt_version: 6.12.0

scopes:
  order: [anonymous, user]
  hierarchical: true
  default: anonymous

security:
  allowed_origins: [self]
  cross_origin_isolation: false

build:
  client_threads: single

entities:
  - name: app
    type: client
    targets: [wasm]

  - name: edge
    type: web_edge
    # Serving the browser over TLS in a release build. `synqt dev` ignores this and
    # runs plaintext on localhost. `synqt build --release` and `synqt serve` require
    # either this block or public.tls_terminated_upstream, so that nothing ships
    # reachable over http:// with nobody named as the one who was meant to stop it.
    tls:
      cert_file: certs/edge/fullchain.pem
      key_file: certs/edge/privkey.pem

  - name: stock
    type: relational

connect_points:
  # The offers the browser watches. Owned by the edge, filled from the database.
  - owner: edge
    consumers: [app]
    # Only these two roles cross the wire. The internal sku the edge keys stock on never
    # reaches the browser-facing offers model.
    export: |
      model offers(string[80] title, int price)  // the live list the browser watches
      slot addToCart(string[40] sku)   // a browser asks to add one to its cart

  # The durable stock. Owned by the database, reachable only by the edge (never the
  # browser. A client consumer here fails `synqt check`, since the database is not a
  # web edge). This is the "database unreachable from the browser" connect point.
  - owner: stock
    consumers: [edge]
    # The stock entity authorizes the calling ENTITY (Caller.entity === "edge"), never a
    # user. A restocked item is announced as a scalar signal (scalars replicate reliably),
    # and the edge maintains the browser-facing Catalog from it.
    export: |
      model items(string[40] sku, string[80] title, int price)        // the durable stock
      slot restock(string[40] sku, string[80] title, int price)       // edge -> stock
      signal itemStocked(string[40] sku, string[80] title, int price) // stock -> edge

# The route table (top level, docs/project-layout-and-config.md). A route with `view:` is
# compiled into the client bundle. A route with `remote:` is delivered by the edge at
# navigation time, so it can be added or changed without a client rebuild.
routes:
  - path: /
    view: Home.qml
  - path: /cart
    view: Cart.qml
  # The public campaign page. One Campaign.qml serves every slug, painted on its first
  # frame from a per-request seed the edge builds (see web/campaign-seed.qml).
  - path: /c/:campaign
    remote: Campaign.qml
    seed: web/edge/campaign-seed.qml
  # A members-only edge-delivered page. An under-scoped fetch is refused with no markup.
  - path: /members
    remote: Members.qml
    scope: user

router:
  fallback: /
  base: /
  palette: [QtQuick, QtQuick.Layouts]
