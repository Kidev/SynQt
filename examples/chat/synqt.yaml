# chat. One room, and everybody in it sees the same thing.
#
# Three entities. A visitor who has signed in as nobody gets the sign-in page, because the
# room's connect point is gated `scope: user` and their session never acquires it. An admin
# erases a message and speaks as staff, and neither of those is a check the browser makes.
project:
  name: chat
  version: 0.1.0
  qt_version: 6.12.0

scopes:
  order: [anonymous, user, admin]
  hierarchical: true
  default: anonymous

security:
  allowed_origins: [self]
  cross_origin_isolation: false

build:
  client_threads: single

# Register an OAuth app with the provider and put its secret in .env. The edge runs the
# whole exchange. The browser ends up holding a session cookie and nothing else.
identity:
  providers:
    - name: github
      client_id: your-client-id-from-github
      client_secret: env:GITHUB_CLIENT_SECRET
  mapping: web/edge/identity/map.qml

entities:
  - name: app
    type: client
    targets: [wasm]

  - name: edge
    type: web_edge
    identity: true
    public:
      port: 8443
      sync_route: /sync
    # Browser TLS for a release build. `synqt dev` serves plaintext on localhost.
    tls:
      cert_file: certs/edge/fullchain.pem
      key_file: certs/edge/privkey.pem

  - name: store
    type: relational
    provider:
      name: sqlite

connect_points:
  # The room as the browser sees it. Two gates, neither of them written in the client:
  # `scope: user` is on the whole point, so a session that has signed in as nobody never
  # acquires it. `<admin>` is on one member, so an ordinary user has no `erase` to call.
  - owner: edge
    consumers: [app]
    scope: user
    export: |
      model messages(int id, string[40] who, string[280] body, bool staff)
      slot say(string[280] body)
      <admin> slot erase(int id)

  # The log. The browser is on no consumer list in this file, so there is no path from a
  # tab to this entity at all.
  - owner: store
    consumers: [edge]
    export: |
      prop var[24000] lines
      slot say(string[40] who, string[280] body, bool staff)
      slot erase(int id)
