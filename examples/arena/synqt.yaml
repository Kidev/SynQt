# The arena, the finished multiplayer game from docs/tutorial-multiplayer.md: a browser
# client, a web edge that serves the client and owns the one authoritative arena (simulated
# once in web/World.qml, sliced per player by web/Arena.qml), and a database that holds the
# permanent all-time Hall of Fame the browser reaches only through the edge.
project:
  name: arena
  version: 0.1.0
  qt_version: 6.11.1

# Signing in is not the same as being allowed in: only approved logins reach `player`
# (web/identity/map.qml is the guest list), and the arena connect point requires it.
scopes:
  order: [anonymous, player]
  hierarchical: true
  default: anonymous

security:
  allowed_origins: [self]
  cross_origin_isolation: false

build:
  client_threads: single

# GitHub sign in (docs/tutorial-multiplayer-world.md). The client_id is public. The client
# secret lives only in web/.env.
identity:
  providers:
    - name: github
      client_id: your-client-id-from-github
      client_secret: env:GITHUB_CLIENT_SECRET
  mapping: web/edge/identity/map.qml

entities:
  - name: app
    type: client
    targets: [wasm]

  - name: edge
    type: web_edge
    # A Source per player session: Arena.qml publishes only that player's
    # slice of the world, so it cannot be one object everybody reaches.
    shared: false
    identity: true
    # Serving the browser over TLS in a release build. `synqt dev` ignores this and
    # runs plaintext on localhost. `synqt build --release` and `synqt serve` require
    # either this block or public.tls_terminated_upstream, so that nothing ships
    # reachable over http:// with nobody named as the one who was meant to stop it.
    tls:
      cert_file: certs/edge/fullchain.pem
      key_file: certs/edge/privkey.pem

  - name: records
    type: relational

connect_points:
  # The whole live world. One Source per caller gives each player their own private view (interest
  # management). The edge simulates once in the World singleton and publishes each player
  # only their slice. scope. Player is the real barrier. An unapproved account never has
  # the edge's point acquired for it, so steer, ping, and the roster are out of reach.
  - owner: edge
    consumers: [app]
    scope: player
    # Only the declared model roles cross to a browser. The edge keeps more per player (a
    # GitHub sub, an aim point, timestamps) that never leaves it. `steer` takes intent (an
    # aim point), never a position. The edge integrates every blob's motion itself, so
    # there is no position for a client to forge.
    export: |
      prop real roundEndsAt                      // edge clock (ms) when the round ends
      // Players in view, for drawing.
      model blobs(string[32] id, string[40] name, real x, real y, real mass, bool online)
      model board(string[40] name, real mass)    // the live leaderboard, biggest first
      model pellets(string[32] id, real x, real y)     // food in view
      model champions(string[40] name, int points)     // all-time Hall of Fame, from the DB
      slot steer(real x, real y)                 // "I am aiming at this spot" (a goal)
      slot real ping()                           // the edge clock in ms, for latency
      signal eaten(string[40] prey, string[40] predator)  // one blob swallowed another
      signal roundEnded(string[40] winner)       // the round closed; winner named

  # The permanent scores. Owned by the database, reachable only by the edge (never the
  # browser. A client consumer here fails `synqt check`, since the database is not a web
  # edge). The edge mirrors the standings into the `arena` model everyone already watches.
  - owner: records
    consumers: [edge]
    # One consumer, the edge, and that list is the whole rule. Nothing else opens a
    # link to this entity, so Records.qml has no check in it about who is calling.
    export: |
      slot award(string[32] sub, string[40] name)  // give this champion one point
      slot var top()                               // the highest scorers, back to the edge
      signal standingsChanged()                    // the table moved; repull
