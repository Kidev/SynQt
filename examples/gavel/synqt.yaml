# The gavel auction, the finished three-entity system from docs/tutorial.md: a browser
# client, a web edge that serves the app and owns the live auction, and the books, a
# database holding the durable Hall of Fame the browser reaches only through the edge.
project:
  name: gavel
  version: 0.1.0
  qt_version: 6.11.1

scopes:
  order: [anonymous, user, moderator, admin]
  hierarchical: true
  default: anonymous

security:
  allowed_origins: [self]
  cross_origin_isolation: false

build:
  client_threads: single

# GitHub sign in (docs/tutorial-sign-in.md). The client_id is public. The client secret
# lives only in web/edge/.env (never here, never anywhere the browser can reach).
identity:
  providers:
    - name: github
      client_id: your-client-id-from-github
      client_secret: env:GITHUB_CLIENT_SECRET
  mapping: web/edge/identity/map.qml

entities:
  - name: app
    type: client
    targets: [wasm]

  - name: edge
    type: web_edge
    identity: true
    # Serving the browser over TLS in a release build. `synqt dev` ignores this and
    # runs plaintext on localhost. `synqt build --release` and `synqt serve` require
    # either this block or public.tls_terminated_upstream, so that nothing ships
    # reachable over http:// with nobody named as the one who was meant to stop it.
    tls:
      cert_file: certs/edge/fullchain.pem
      key_file: certs/edge/privkey.pem

  - name: books
    type: relational

connect_points:
  # The live auction and the Hall of Fame: the edge is the single authority, and the browser
  # may watch and bid. An entity has one connect point, so everything the browser reaches is
  # here, and who may reach each member is written on the member.
  #
  # The edge is shared (the default), so one Source answers everybody and each bid still
  # arrives with its Caller: the signed-in user the edge authorizes.
  - owner: edge
    consumers: [app]
    # What may cross, and nothing else does. Properties flow owner -> consumers. A slot
    # flows the other way (a consumer asks, the owner decides). The bidder is not an
    # argument. The edge stamps the high bidder from the caller's verified identity, never
    # from a typed name.
    #
    # A `<scope>` in front of a member is the gate on it. A caller without that scope does
    # not have the member. The slot is refused before it runs, so there is no check to
    # write, and to forget, in the QML that implements it.
    #
    # The three properties are exported by name. Web/edge/Edge.qml binds each of
    # them to Edge.qml, which declares what they are, so saying it twice here would be a
    # second place to keep in step. `synqt check` refuses a name the owner does not have.
    export: |
      itemName                        // what is up for auction
      highBid                         // the current highest bid
      highBidder                      // who holds the high bid right now
      // A live list the browser watches. Every role is typed, so a row that does not
      // match is refused where it is published rather than serialized.
      model winners(string[80] item, string[80] winner, int amount)
      <user> slot placeBid(int amount)             // only signed-in users bid
      <admin> slot closeLot(string[80] nextItem)   // an auctioneer closes a lot, opens the next
      signal bidRejected(string[120] reason)

  # The durable ledger. Owned by the books, reachable only by the edge (never the
  # browser. A client consumer here fails `synqt check`, since the books entity is not a
  # web edge). That one-name consumer list is the whole rule, which is why
  # Books.qml has no check in it about who is calling.
  - owner: books
    consumers: [edge]
    # A recorded winner is announced as a scalar signal (scalars replicate reliably), and
    # the edge maintains the browser-facing Hall from it.
    export: |
      prop int count                                                  // recorded winners
      slot recordWinner(string[80] item, string[80] winner, int amount)  // edge -> books
      signal winnerRecorded(string[80] item, string[80] winner, int amount)
